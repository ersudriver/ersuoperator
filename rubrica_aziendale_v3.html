<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca Contatti Real-time</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Josefin Sans', sans-serif; 
            background-color: #a4bb5b; /* Colore sfondo pagina */
            color: #2c603d; /* Colore testo principale */
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
        }
        
        .container { 
            background: #a4bb5b; /* Colore sfondo container */
            padding: 2rem; 
            border-radius: 12px; 
            border: 2px solid #2c603d; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
        }

        h2 {
            color: #2c603d;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 2px solid #2c603d; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            font-family: 'Josefin Sans', sans-serif;
            background-color: transparent;
            color: #2c603d;
            outline: none;
        }

        input::placeholder {
            color: #2c603d;
            opacity: 0.7;
        }

        .result-item { 
            padding: 15px 10px; 
            border-bottom: 1px solid #2c603d; 
            text-align: left; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .name { 
            font-weight: 600; 
            color: #2c603d; 
        }
