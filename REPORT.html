<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Segnalazione Foto</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            touch-action: pan-y;
        }


        body {
            font-family: 'Josefin Sans', sans-serif;
            min-height: 100vh;
            color: #2c603d;
            background-color: #a4bb5b;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(44,96,61,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(44,96,61,0.08) 0%, transparent 50%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(44,96,61,0.03) 40px, rgba(44,96,61,0.03) 41px);
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, #1e4a2a 0%, #2c603d 40%, #3a7a4e 100%);
            color: #a4bb5b;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #a4bb5b, #d4e68a, #a4bb5b);
        }

        header h1 { font-size: 4.5rem; font-weight: 700; letter-spacing: 2px; animation: fadeSlide 1s ease-out; }
        header h1 a { color: inherit; text-decoration: none; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .container {
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(6px);
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 760px;
            margin: 2rem auto;
            box-shadow: 0 4px 15px rgba(44,96,61,0.12);
            text-align: center;
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            font-size: 1.6rem;
        }

        .stato {
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 1.4rem;
            margin-bottom: 1rem;
        }

        .buttons {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 0.7rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(44,96,61,0.08);
            border: 2px solid #2c603d;
            border-radius: 1rem;
            padding: 0.7rem 1rem;
            color: #2c603d;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.3s, color 0.3s, transform 0.3s;
        }

        .btn:hover { background: #2c603d; color: #a4bb5b; transform: translateY(-3px); }
        .btn svg { width: 20px; height: 20px; }
        .btn[hidden] { display: none; }

        .btn-primary { background: #2c603d; color: #a4bb5b; }
        .btn-primary:hover { background: #1e4a2a; color: #d4e68a; }

        .btn.scatta { background: #c0392b; border-color: #c0392b; color: #ffffff; }
        .btn.scatta:hover { background: #96281b; border-color: #96281b; color: #ffffff; }

        .hint-camera {
            position: absolute;
            top: 14px;
            left: 12px;
            right: 12px;
            z-index: 3;
            margin: 0;
            text-align: center;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.85);
            animation: dissolvenza 2.4s ease-in-out infinite;
        }

        .hint-camera[hidden] { display: none; }

        @keyframes dissolvenza {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .camera-box {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto 1rem;
        }

        .camera-vista { position: relative; }
        .camera-vista[hidden] { display: none; }
        .camera-frame { position: relative; }

        .camera-buttons { position: relative; z-index: 2; }

        .camera-box.attiva .camera-buttons {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;
            margin-bottom: 0;
        }

        .camera-box.attiva .camera-buttons .btn {
            background: rgba(30,74,42,0.78);
            border-color: #a4bb5b;
            color: #d4e68a;
        }

        .camera-box.attiva .camera-buttons .btn.scatta {
            background: rgba(192,57,43,0.92);
            border-color: #ffffff;
            color: #ffffff;
        }

        video {
            width: 100%;
            border: 3px solid #2c603d;
            border-radius: 1rem;
            background: #1e4a2a;
            display: block;
        }

        .guida-centro {
            position: absolute;
            inset: 0;
            border-radius: 1rem;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.15;
            z-index: 1;
            background:
                linear-gradient(to right, transparent calc(33.333% - 1px), #ffffff calc(33.333% - 1px), #ffffff calc(33.333% + 1px), transparent calc(33.333% + 1px)),
                linear-gradient(to right, transparent calc(66.666% - 1px), #ffffff calc(66.666% - 1px), #ffffff calc(66.666% + 1px), transparent calc(66.666% + 1px)),
                linear-gradient(to bottom, transparent calc(33.333% - 1px), #ffffff calc(33.333% - 1px), #ffffff calc(33.333% + 1px), transparent calc(33.333% + 1px)),
                linear-gradient(to bottom, transparent calc(66.666% - 1px), #ffffff calc(66.666% - 1px), #ffffff calc(66.666% + 1px), transparent calc(66.666% + 1px));
        }

        .anteprima-box {
            position: relative;
            width: 100%;
            margin: 0 auto 1rem;
        }

        .anteprima-box[hidden] { display: none; }

        #anteprima {
            width: 100%;
            height: auto;
            border: 3px solid #2c603d;
            border-radius: 1rem;
            display: block;
            background: rgba(44,96,61,0.08);
        }

        .condividi-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .condividi-overlay[hidden] { display: none; }

        .condividi-overlay .btn {
            pointer-events: auto;
            background: rgba(30,74,42,0.92);
            border-color: #d4e68a;
            color: #d4e68a;
            font-size: 1.1rem;
            padding: 0.9rem 1.6rem;
            box-shadow: 0 4px 18px rgba(0,0,0,0.35);
        }

        .condividi-overlay .btn:hover { background: #1e4a2a; color: #ffffff; }

        textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            margin-bottom: 1rem;
            border: 2px solid #2c603d;
            border-radius: 0.8rem;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 1rem;
            color: #2c603d;
            background: rgba(255,255,255,0.25);
            resize: none;
        }

        .coord-manuali {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .coord-manuali input {
            width: 150px;
            padding: 8px;
            border: 2px solid #2c603d;
            border-radius: 0.6rem;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c603d;
            background: rgba(255,255,255,0.25);
        }

        .coord-manuali[hidden] { display: none; }

        .home-link { text-align: center; margin: 0 auto 3rem; }

        .link-home {
            display: inline-block;
            color: #2c603d;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border: 2px solid #2c603d;
            padding: 12px 30px;
            border-radius: 1rem;
            transition: background 0.3s, color 0.3s, transform 0.3s;
        }

        .link-home:hover { background: #2c603d; color: #a4bb5b; transform: translateY(-3px); }

        footer { text-align: center; padding: 1.5rem; opacity: 0.6; font-size: 0.9rem; }

        @media (max-width: 600px) {
            header h1 { font-size: 2.5rem; }
            .container { width: calc(100% - 2rem); margin: 1.5rem auto; padding: 1.2rem; }
            .btn { font-size: 0.8rem; padding: 0.55rem 0.6rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html" style="color:inherit; text-decoration:none;">Portale Operatori</a></h1>
    </header>

    <div class="container">
        <h2>INOLTRA SEGNALAZIONE</h2>

        <p class="stato" id="stato">Posizione: richiesta in corso...</p>

        <div class="coord-manuali" id="coordManuali" hidden>
            <input type="number" step="any" id="latInput" placeholder="latitudine">
            <input type="number" step="any" id="lonInput" placeholder="longitudine">
            <button type="button" class="btn" onclick="impostaCoordinateManuali()">Imposta coordinate</button>
        </div>

        <div class="camera-box" id="cameraBox">
            <div class="camera-vista" id="cameraVista" hidden>
                <div class="camera-frame">
                    <video id="video" autoplay playsinline muted></video>
                    <div class="guida-centro"></div>
                </div>
            </div>
            <p class="hint-camera" id="hintCamera" hidden>tieni il soggetto al centro dell'immagine</p>
            <div class="buttons camera-buttons">
                <button type="button" class="btn" id="btnCamera" onclick="gestisciFotocamera()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    <span id="etichettaCamera">FOTOCAMERA</span>
                </button>
                <button type="button" class="btn" id="btnPosizione" onclick="richiediPosizione(true)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span id="etichettaPosizione">POSIZIONE</span>
                </button>
            </div>
        </div>

        <div class="anteprima-box" id="anteprimaBox" hidden>
            <canvas id="anteprima" width="1200" height="1500"></canvas>
            <div class="condividi-overlay" id="condividiOverlay" hidden>
                <button type="button" class="btn btn-primary" onclick="condividi()">CONDIVIDI</button>
            </div>
        </div>

        <textarea id="commento" placeholder="Scrivi su che giro sei e/o un breve commento" oninput="generaFrame()"></textarea>
    </div>

    <div class="home-link">
        <a href="index.html" class="link-home">torna alla homepage</a>
    </div>

    <footer>&copy; 2026 Portale Operatori</footer>

        let faviconCache = null;

        const MAP_SIZE = 410;

        const stato = document.getElementById('stato');

        function messaggio() {
            const posizione = lat !== null
                ? `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`
                : 'non disponibile';
            const commento = document.getElementById('commento').value.trim() || '(nessun commento)';
            return `⚠️ SEGNALAZIONE\n📌 POSIZIONE: ${posizione}\n💬 ${commento}\n🔗 https://ersudriver.github.io/ersuoperator/REPORT`;
        }

        function richiediPosizione(manuale = false) {
            if (manuale) document.getElementById('etichettaPosizione').textContent = 'AGGIORNA';
            stato.textContent = 'Posizione: richiesta in corso...';
            if (!navigator.geolocation) {
                errorePosizione();
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => {
                    lat = pos.coords.latitude;
                    lon = pos.coords.longitude;
                    stato.textContent = `Posizione: ${lat.toFixed(6)}, ${lon.toFixed(6)} (precisione ${Math.round(pos.coords.accuracy)} m)`;
                    document.getElementById('coordManuali').hidden = true;
                    mappaCache = null;
                    generaFrame();
                },
                errorePosizione,
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function errorePosizione() {
            stato.textContent = 'Posizione non disponibile: inseriscila manualmente qui sotto.';
            document.getElementById('coordManuali').hidden = false;
        }

        function impostaCoordinateManuali() {
            const nLat = parseFloat(document.getElementById('latInput').value);
            const nLon = parseFloat(document.getElementById('lonInput').value);
            if (isNaN(nLat) || isNaN(nLon)) return;
            lat = nLat;
            lon = nLon;
            stato.textContent = `Posizione impostata: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            document.getElementById('coordManuali').hidden = true;
            mappaCache = null;
            generaFrame();
        }

        function gestisciFotocamera() {
            if (stream && video.srcObject) scatta();
            else avviaCamera();
        }

        async function avviaCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                stato.textContent = 'Fotocamera non supportata su questo dispositivo o browser.';
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = stream;
                document.getElementById('cameraVista').hidden = false;
                document.getElementById('cameraBox').classList.add('attiva');
                document.getElementById('etichettaCamera').textContent = 'SCATTA';
                document.getElementById('btnCamera').classList.add('scatta');
                document.getElementById('hintCamera').hidden = false;
                stato.textContent = 'Fotocamera attiva: inquadra e premi SCATTA.';
            } catch (e) {
                stato.textContent = 'Permesso fotocamera negato o fotocamera non disponibile.';
            }
        }

        function fermaCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            document.getElementById('cameraVista').hidden = true;
            document.getElementById('cameraBox').classList.remove('attiva');
            video.srcObject = null;
            document.getElementById('etichettaCamera').textContent = 'FOTOCAMERA';
            document.getElementById('btnCamera').classList.remove('scatta');
            document.getElementById('hintCamera').hidden = true;
        }

        function scatta() {
            if (!video.videoWidth) return;
            const c = document.createElement('canvas');
            c.width = video.videoWidth;
            c.height = video.videoHeight;
            c.getContext('2d').drawImage(video, 0, 0);
            fotoOriginale = c;
            fermaCamera();
            generaFrame();
        }

        function caricaImmagine(src, crossOrigin) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                if (crossOrigin) img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        async function caricaFavicon() {
            if (!faviconCache) faviconCache = await caricaImmagine(FAVICON_DATA, false);
            return faviconCache;
        }

        function disegnaMappaSemplice(ctx, conPosizione) {
            const S = MAP_SIZE;
            ctx.fillStyle = '#e8efd2';
            ctx.fillRect(0, 0, S, S);

            ctx.fillStyle = '#cfe0a8';
            ctx.fillRect(0, 0, S * 0.3, S * 0.28);
            ctx.fillRect(S * 0.67, S * 0.66, S * 0.33, S * 0.34);

            ctx.lineWidth = 12;
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, S * 0.37); ctx.lineTo(S, S * 0.37);
            ctx.moveTo(0, S * 0.74); ctx.lineTo(S, S * 0.74);
            ctx.moveTo(S * 0.31, 0); ctx.lineTo(S * 0.31, S);
            ctx.moveTo(S * 0.73, 0); ctx.lineTo(S * 0.73, S);
            ctx.stroke();

            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(44,96,61,0.28)';
            ctx.beginPath();
            ctx.moveTo(0, S * 0.37); ctx.lineTo(S, S * 0.37);
            ctx.moveTo(0, S * 0.74); ctx.lineTo(S, S * 0.74);
            ctx.moveTo(S * 0.31, 0); ctx.lineTo(S * 0.31, S);
            ctx.moveTo(S * 0.73, 0); ctx.lineTo(S * 0.73, S);
            ctx.stroke();

            ctx.fillStyle = '#2c603d';
            ctx.font = '600 16px "Josefin Sans", sans-serif';
            ctx.fillText('MAPPA', 12, 28);
            if (!conPosizione) {
                ctx.font = '600 15px "Josefin Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('POSIZIONE NON DISPONIBILE', S / 2, S - 16);
                ctx.textAlign = 'left';
            }
        }

        async function creaMappa() {
            const chiave = `${lat},${lon}`;
            if (mappaCache && mappaCacheKey === chiave) return mappaCache;

            const m = document.createElement('canvas');
            m.width = MAP_SIZE;
            m.height = MAP_SIZE;
            const ctx = m.getContext('2d');
            const centro = MAP_SIZE / 2;

            let successo = false;

            if (lat !== null) {
                try {
                    const z = 16;
                    const n = Math.pow(2, z);
                    const xf = (lon + 180) / 360 * n;
                    const rad = lat * Math.PI / 180;
                    const yf = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;

                    // Il centro della mappa quadrata coincide con la posizione dell'utente
                    const origineX = xf * 256 - centro;
                    const origineY = yf * 256 - centro;
                    const txCentro = Math.floor(xf);
                    const tyCentro = Math.floor(yf);

                    const tiles = [];
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            const tx = ((txCentro + dx) % n + n) % n;
                            const ty = tyCentro + dy;
                            if (ty < 0 || ty >= n) continue;
                            tiles.push({ tx, ty, x: (txCentro + dx) * 256 - origineX, y: (tyCentro + dy) * 256 - origineY });
                        }
                    }

                    const server = [
                        t => `https://tile.openstreetmap.org/${z}/${t.tx}/${t.ty}.png`,
                        t => `https://a.basemaps.cartocdn.com/light_all/${z}/${t.tx}/${t.ty}.png`
                    ];

                    for (const url of server) {
                        const immagini = await Promise.all(tiles.map(t =>
                            caricaImmagine(url(t), true)
                                .then(img => ({ img, x: t.x, y: t.y }))
                                .catch(() => null)
                        ));
                        if (immagini.filter(Boolean).length >= Math.ceil(tiles.length / 2)) {
                            immagini.forEach(t => {
                                if (t) ctx.drawImage(t.img, t.x, t.y);
                            });
                            successo = true;
                            break;
                        }
                    }
                } catch (e) {
                    console.warn('Tile mappa non caricati:', e);
                }
            }

            if (!successo) {
                disegnaMappaSemplice(ctx, lat !== null);
            }

            // Marker sempre al centro: è il punto in cui si trova l'utente
            ctx.beginPath();
            ctx.arc(centro, centro, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centro, centro, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#c0392b';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centro, centro, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            mappaCache = m;
            mappaCacheKey = chiave;
            return m;
        }

        function righeTesto(ctx, testo, maxLarghezza) {
            const parole = testo.split(/\s+/);
            const righe = [];
            let riga = '';
            parole.forEach(parola => {
                const prova = riga ? riga + ' ' + parola : parola;
                if (ctx.measureText(prova).width > maxLarghezza && riga) {
                    righe.push(riga);
                    riga = parola;
                } else {
                    riga = prova;
                }
            });
            if (riga) righe.push(riga);
            return righe;
        }

        async function generaFrame() {
            if (!fotoOriginale) {
                document.getElementById('anteprimaBox').hidden = true;
                document.getElementById('condividiOverlay').hidden = true;
                fotoBlob = null;
                return;
            }

            const P = 24;
            const W = 1200;
            const H = Math.round(W * 5 / 4);
            const INFO = 500;
            const drawW = W - 2 * P;
            const drawH = H - 2 * P - INFO;

            const out = document.createElement('canvas');
            out.width = W;
            out.height = H;
            const ctx = out.getContext('2d');

            ctx.fillStyle = '#2c603d';
            ctx.fillRect(0, 0, W, H);

            // Ritaglio la foto per coprire l'area senza deformarla
            const scala = Math.max(drawW / fotoOriginale.width, drawH / fotoOriginale.height);
            const sw = drawW / scala;
            const sh = drawH / scala;
            const sx = (fotoOriginale.width - sw) / 2;
            const sy = (fotoOriginale.height - sh) / 2;
            ctx.drawImage(fotoOriginale, sx, sy, sw, sh, P, P, drawW, drawH);

            const infoY = P + drawH;
            ctx.fillStyle = 'rgba(30,74,42,0.7)';
            ctx.fillRect(P, infoY, drawW, INFO);

            const mappa = await creaMappa();
            const favicon = await caricaFavicon().catch(() => null);
            const mx = P + 20;
            const my = infoY + (INFO - MAP_SIZE) / 2;
            ctx.drawImage(mappa, mx, my, MAP_SIZE, MAP_SIZE);
            ctx.strokeStyle = '#a4bb5b';
            ctx.lineWidth = 3;
            ctx.strokeRect(mx, my, MAP_SIZE, MAP_SIZE);

            const tx = mx + MAP_SIZE + 28;
            const maxTextW = W - P - 16 - tx;
            const c = document.getElementById('commento').value.trim() || '(nessun commento)';
            const coordinate = lat !== null ? `${lat.toFixed(6)}, ${lon.toFixed(6)}` : 'non disponibili';
            const ora = new Date();
            const data = ora.toLocaleDateString('it-IT');
            const tempo = ora.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

            ctx.textAlign = 'left';
            ctx.fillStyle = '#d4e68a';
            ctx.font = '700 45px "Josefin Sans", sans-serif';
            ctx.fillText('SEGNALAZIONE', tx, infoY + 65);

            ctx.fillStyle = '#ffffff';
            ctx.font = '600 40px "Josefin Sans", sans-serif';
            ctx.fillText(`GPS: ${coordinate}`, tx, infoY + 135);

            ctx.fillStyle = '#d4e68a';
            ctx.font = '700 39px "Josefin Sans", sans-serif';
            ctx.fillText('COMMENTO:', tx, infoY + 205);

            ctx.fillStyle = '#ffffff';
            ctx.font = '400 36px "Josefin Sans", sans-serif';
            const righeTutte = righeTesto(ctx, c, maxTextW);
            const righe = righeTutte.slice(0, 4);
            righe.forEach((riga, i) => {
                ctx.fillText(riga, tx, infoY + 260 + i * 44);
            });
            if (righeTutte.length > 4) {
                ctx.fillText('…', tx + ctx.measureText(righe[3]).width + 4, infoY + 260 + 3 * 44);
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = '700 34px "Josefin Sans", sans-serif';
            const larghezzaData = ctx.measureText(data).width;
            ctx.fillText(data, tx, infoY + 450);

            ctx.fillStyle = '#a4bb5b';
            ctx.font = '400 26px "Josefin Sans", sans-serif';
            ctx.fillText(tempo, tx + larghezzaData + 14, infoY + 450);

            if (favicon) {
                const lato = 72;
                const fx = W - P - 20 - lato;
                const fy = infoY + INFO - 20 - lato;
                ctx.beginPath();
                ctx.arc(fx + lato / 2, fy + lato / 2, lato * 0.58, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.fill();
                ctx.drawImage(favicon, fx, fy, lato, lato);
            }

            outputCanvas = out;
            anteprima.width = W;
            anteprima.height = H;
            document.getElementById('anteprimaBox').hidden = false;
            document.getElementById('condividiOverlay').hidden = false;
            anteprima.getContext('2d').drawImage(out, 0, 0);

            out.toBlob(blob => {
                fotoBlob = blob;
            }, 'image/jpeg', 0.92);
        }

        async function condividi() {
            if (!fotoBlob) return;
            const file = new File([fotoBlob], `segnalazione_${Date.now()}.jpg`, { type: 'image/jpeg' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ title: 'Segnalazione', text: messaggio(), files: [file] });
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }
            try { await navigator.clipboard.writeText(messaggio()); } catch (e) { /* clipboard non disponibile */ }
            alert('Condivisione file non supportata da questo browser. Il testo della segnalazione con il link alla posizione è stato copiato: apri WhatsApp e incollalo, condividendo la foto dallo smartphone.');
        }

        richiediPosizione();
        generaFrame();
    </script>
