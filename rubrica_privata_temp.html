    <style>
        body {
            font-family: 'Josefin Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Sfondo richiesto */
            background-color: #a4bb5b; 
            /* Colore testo richiesto */
            color: #2c603d;            
        }

        .container {
            padding: 20px;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h2, p, .warning, .link-home { 
            color: #2c603d; 
        }

        input[type="password"] {
            width: 100%;
            max-width: 280px;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #2c603d; 
            border-radius: 8px;
            background: transparent;
            text-align: center;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 16px;
            color: #2c603d;
            outline: none;
        }

        /* Pulsante interamente nel colore 2c603d */
        .btn-download {
            background-color: #2c603d;
            color: #a4bb5b; 
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            display: inline-block;
            border: none;
            cursor: pointer;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 16px;
            margin-top: 10px;
        }

        .warning {
            font-weight: 600;
            margin-top: 25px;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* Il contenuto protetto è nascosto inizialmente */
        #protected-content { 
            display: none; 
            flex-direction: column;
            align-items: center;
        }
        
        #login-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .link-home {
            margin-top: 30px;
            text-decoration: none;
            display: inline-block;
            border-bottom: 1px solid #2c603d;
        }
    </style>
</head>

            ATTENZIONE! questo file contiene più di 500 contatti.

    </div>
