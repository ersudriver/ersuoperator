<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Musicale</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset per evitare spazi vuoti */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #a4bb5b; /* Il tuo colore di sfondo */
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c603d; /* Il tuo colore del testo */
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Contenitore per il bottone-immagine */
        .bottone-container {
            width: 200px;
            height: 200px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bottone-immagine {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
            /* Se l'immagine non carica, mostriamo un bordo per far capire che c'è qualcosa */
            border: 2px dashed #2c603d; 
        }

        #link-home {
            margin-top: 40px;
            color: #2c603d;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.2rem;
            border-bottom: 2px solid #2c603d;
        }

        /* Feedback visivo quando si preme */
        #bottone-immagine:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <h1>QUI NON C'È NIENTE</h1>

    <div class="bottone-container" onclick="toggleMusica()">
        <img id="bottone-immagine" 
             src="https://lh3.googleusercontent.com/u/0/d/13y1rIMH7gzAYdEYEs-k5rpraZis5Rb0o" 
             alt="Premi qui per la musica">
    </div>

    <a id="link-home" href="/">HOMEPAGE</a>

    <audio id="musica" loop>
        <source src="tre_camionisti.mp3" type="audio/mpeg">
    </audio>

    <script>
        const musica = document.getElementById('musica');

        function toggleMusica() {
            if (musica.paused) {
                musica.play().catch(error => {
                    console.log("Errore: il file audio potrebbe mancare o il browser lo blocca.");
                });
            } else {
                musica.pause();
            }
        }
    </script>

</body>
</html>
