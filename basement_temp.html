<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Musicale Mobile</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset di base per evitare margini indesiderati */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #a4bb5b;
            color: #2c603d;
            font-family: 'Josefin Sans', sans-serif;
            
            /* Centratura perfetta sia su PC che su Mobile */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 8vw; /* Dimensione dinamica basata sulla larghezza schermo */
            max-font-size: 40px; /* Limite massimo per schermi grandi */
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        #bottone-immagine {
            cursor: pointer;
            width: 60%;      /* Occupa il 60% della larghezza su mobile */
            max-width: 300px; /* Non diventa troppo grande su PC */
            height: auto;
            border-radius: 50%; /* Opzionale: rende l'immagine tonda se è quadrata */
            transition: transform 0.1s ease-in-out;
            -webkit-tap-highlight-color: transparent; /* Rimuove il fastidioso rettangolo blu al tocco su Android/iOS */
        }

        #bottone-immagine:active {
            transform: scale(0.9);
        }

        #link-home {
            margin-top: 50px;
            color: #2c603d;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 2px solid #2c603d;
            padding-bottom: 5px;
            font-size: 1.2rem;
        }
