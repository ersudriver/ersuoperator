<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basement</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #a4bb5b;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c603d;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Contenitore immagine senza bordi */
        .bottone-container {
            width: 200px;
            height: 200px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        #bottone-immagine {
            max-width: 100%;
            max-height: 100%;
            transition: transform 0.1s;
        }

        /* Effetto pressione al click */
        #bottone-immagine:active {
            transform: scale(0.9);
        }

        /* Link Homepage senza sottolineatura */
        #link-home {
            margin-top: 40px;
            color: #2c603d;
            font-weight: bold;
            text-decoration: none; /* Rimuove la sottolineatura */
            font-size: 1.2rem;
            text-transform: lowercase; /* Opzionale, per stile */
        }

        /* Media query per smartphone */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .bottone-container { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>

    <h1>QUI NON C'È NIENTE</h1>

    <div class="bottone-container" onclick="toggleMusica()">
        <img id="bottone-immagine" 
             src="https://lh3.googleusercontent.com/u/0/d/13y1rIMH7gzAYdEYEs-k5rpraZis5Rb0o" 
             alt="Premi per la musica">
    </div>

    <a id="link-home" href="/">torna alla homepage</a>

    <audio id="musica" loop>
        <source src="tre_camionisti.mp3" type="audio/mpeg">
    </audio>

    <script>
        const musica = document.getElementById('musica');

        function toggleMusica() {
            if (musica.paused) {
                musica.play().catch(e => console.log("Audio non caricato"));
            } else {
                musica.pause();
            }
        }
    </script>

</body>
</html>
