<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Musicale Grande</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #a4bb5b;
            overflow: hidden; /* Evita lo scroll se non necessario */
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c603d;
            text-align: center;
        }

        h1 {
            font-size: 3rem; /* Testo più grande */
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Contenitore immagine MOLTO più grande */
        .bottone-container {
            width: 350px;  /* Dimensione aumentata */
            height: 350px; /* Dimensione aumentata */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        #bottone-immagine {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene le proporzioni dell'immagine */
            transition: transform 0.1s;
        }

        /* Effetto pressione al click */
        #bottone-immagine:active {
            transform: scale(0.95);
        }

        #link-home {
            margin-top: 40px;
            color: #2c603d;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.5rem; /* Link più grande */
        }

        /* Regolazioni per Smartphone */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .bottone-container { 
                width: 80vw; /* Usa l'80% della larghezza dello schermo del telefono */
                height: 80vw; 
            }
            #link-home { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <h1>QUI NON C'È NIENTE</h1>

    <div class="bottone-container" onclick="toggleMusica()">
        <img id="bottone-immagine" 
             src="https://lh3.googleusercontent.com/u/0/d/13y1rIMH7gzAYdEYEs-k5rpraZis5Rb0o" 
             alt="Premi per la musica">
    </div>

    <a id="link-home" href="/">homepage</a>

    <audio id="musica" loop>
        <source src="tre_camionisti.mp3" type="audio/mpeg">
    </audio>

    <script>
        const musica = document.getElementById('musica');

        function toggleMusica() {
            if (musica.paused) {
                musica.play().catch(e => {
                    alert("Clicca sull'immagine per far partire la musica!");
                });
            } else {
                musica.pause();
            }
        }
    </script>

</body>
</html>
