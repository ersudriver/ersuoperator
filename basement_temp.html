<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basement</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Setup generale della pagina */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #a4bb5b;
            overflow: hidden; /* Evita lo scrolling */
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c603d;
            text-align: center;
            padding: 20px;
        }

        /* Titolo superiore */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Il "Bottone" Immagine GIGANTE */
        .bottone-container {
            width: 450px;  /* Dimensione desktop */
            height: 450px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        #bottone-immagine {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.15s ease;
        }

        /* Effetto quando si clicca */
        #bottone-immagine:active {
            transform: scale(0.92);
        }

        /* Link alla Homepage aggiornato */
        #link-home {
            margin-top: 30px;
            color: #2c603d;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.8rem;
        }

        /* Ottimizzazione per Smartphone */
        @media (max-width: 600px) {
            h1 { 
                font-size: 2.2rem; 
                margin-bottom: 15px;
            }
            .bottone-container { 
                width: 90vw; /* Quasi tutta la larghezza del telefono */
                height: 90vw; 
            }
            #link-home { 
                font-size: 1.4rem; 
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>QUI NON C'È NIENTE</h1>

    <div class="bottone-container" onclick="toggleMusica()">
        <img id="bottone-immagine" 
             src="https://lh3.googleusercontent.com/u/0/d/13y1rIMH7gzAYdEYEs-k5rpraZis5Rb0o" 
             alt="Riproduci tre_camionisti.mp3">
    </div>

    <a id="link-home" href="https://ersudriver.github.io/ersuoperator/#">homepage</a>

    <audio id="musica" loop>
        <source src="tre_camionisti.mp3" type="audio/mpeg">
    </audio>

    <script>
        const musica = document.getElementById('musica');

        function toggleMusica() {
            if (musica.paused) {
                musica.play().catch(error => {
                    console.log("Assicurati che tre_camionisti.mp3 sia nella cartella!");
                });
            } else {
                musica.pause();
            }
        }
    </script>

</body>
</html>
