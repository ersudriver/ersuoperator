<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizza Lista</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Josefin Sans', sans-serif; 
            background-color: #a4bb5b; 
            color: #2c603d; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
            min-height: 100vh;
        }
        
        .container { 
            background: #a4bb5b; 
            padding: 2rem; 
            border-radius: 12px; 
            border: 2px solid #2c603d; 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
        }

        h2 {
            color: #2c603d;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Iframe con altezza fissa per essere sicuri che si veda */
        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #2c603d;
            border-radius: 8px;
            background-color: white; /* Aiuta a vedere il contenuto se il foglio è bianco */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Lista Completa Contatti</h2>
    
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS67eexfd9Plogb9viPBDF3GnSsaBAHn54ghW_qmWhlu3V5p5GsmYYG9f1lSFUldXxhM90AHhBZJGpB/pubhtml?widget=true&amp;headers=false"></iframe>
</div>

</body>
</html>
