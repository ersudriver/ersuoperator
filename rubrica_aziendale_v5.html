<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca Contatti Real-time</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Josefin Sans', sans-serif; 
            background-color: #a4bb5b; 
            color: #2c603d; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
        }
        
        .container { 
            background: #a4bb5b; 
            padding: 2rem; 
            border-radius: 12px; 
            border: 2px solid #2c603d; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
        }

        /* Contenitore per allineare freccia e titolo */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .back-link {
            text-decoration: none;
            color: #2c603d;
            font-size: 24px;
            font-weight: 700;
        }

        h2 {
            color: #2c603d;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0; /* Rimosso margin per allineamento preciso */
        }

        .btn-vcf {
            display: inline-block;
            background-color: #2c603d;
            color: #a4bb5b;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 25px;
            transition: opacity 0.3s;
        }

        .btn-vcf:hover {
            opacity: 0.9;
        }

        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 2px solid #2c603d; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            font-family: 'Josefin Sans', sans-serif;
            background-color: transparent;
            color: #2c603d;
            outline: none;
        }

        input::placeholder {
            color: #2c603d;
            opacity: 0.7;
        }

        .result-item { 
            padding: 15px 10px; 
            border-bottom: 1px solid #2c603d; 
            text-align: left; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .name { 
            font-weight: 600; 
            color: #2c603d; 
        }

        .number-link { 
            color: #2c603d; 
            font-weight: 700; 
            text-decoration: none; 
            border: 1px solid #2c603d;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .number-link:active {
            background-color: #2c603d;
            color: #a4bb5b;
        }

        .no-results { 
            color: #2c603d; 
            margin-top: 20px; 
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <a href="/" class="back-link">&lt;</a>
        <h2>Rubrica Aziendale</h2>
    </div>

    <a href="rubrica_aziendale.vcf" class="btn-vcf">scarica tutti i contatti</a>
    
    <input type="text" id="searchInput" placeholder="oppure inizia scrivi un nome o un cognome..." onkeyup="searchData()">
    <div id="results"></div>
</div>

<script>
    let dataCache = [];
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS67eexfd9Plogb9viPBDF3GnSsaBAHn54ghW_qmWhlu3V5p5GsmYYG9f1lSFUldXxhM90AHhBZJGpB/pub?output=csv';

    async function loadData() {
        try {
            const response = await fetch(sheetUrl);
            const text = await response.text();
            const rows = text.split('\n').slice(1); 
            dataCache = rows.map(row => {
                const columns = row.split(',');
                return { nome: columns[0]?.trim(), numero: columns[1]?.trim() };
            });
        } catch (error) {
            console.error("Errore nel caricamento dati:", error);
        }
    }

    function searchData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        if (query.length < 2) return; 

        const filtered = dataCache.filter(item => 
            item.nome && item.nome.toLowerCase().includes(query)
        );

        if (filtered.length > 0) {
            filtered.forEach(item => {
                const cleanNumber = item.numero.replace(/\s+/g, '');
                
                resultsDiv.innerHTML += `
                    <div class="result-item">
                        <span class="name">${item.nome}</span>
                        <a href="tel:${cleanNumber}" class="number-link">${item.numero}</a>
                    </div>`;
            });
        } else {
            resultsDiv.innerHTML = '<p class="no-results">Nessun contatto trovato</p>';
        }
    }

    loadData();
</script>

</body>
</html>
