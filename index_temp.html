<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portale Operatori</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset e Stili Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Josefin Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #a4bb5b;
            color: #2c603d;
        }

        .header-img {
            width: 100%;
            height: auto;
            display: block;
        }

        footer {
            background-color: #2c603d; 
            color: #a4bb5b;
            padding: 20px;
            text-align: center;
            width: 100%;
        }

        .footer-links {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer-links a {
            color: #a4bb5b;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Scritta Italic Sotto il Footer */
        .scroll-hint {
            text-align: center;
            font-style: italic;
            font-size: 14px;
            margin-top: 15px;
            color: #2c603d;
            width: 100%;
            min-height: 20px;
        }

        /* Griglia */
        .main-content {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px 20px;
            padding: 20px 20px 40px 20px;
            justify-items: center;
            align-items: start;
            width: 100%;
            flex-grow: 1; /* Spinge il counter verso il basso */
        }

        .grid-item {
            width: 100%;
            max-width: 120px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .grid-item:active {
            transform: scale(0.9);
        }

        .grid-item img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0px 4px 6px rgba(44, 96, 61, 0.4));
            border-radius: 10px;
        }

        .grid-item span {
            color: #2c603d;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Stile per il Counter Visite */
        .visit-counter {
            text-align: center;
            padding: 20px 0;
            font-size: 12px;
            color: #2c603d;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .main-content {
                gap: 25px 15px;
                padding: 10px 10px 30px 10px;
            }
            .grid-item span {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <img src="hder.png" alt="Header" class="header-img">

    <footer>
        <div class="footer-links">
            <a href="https://ersudriver.github.io/ersuoperator/coordinatori">Coordinatori</a>
            <a href="https://ersudriver.github.io/ersuoperator/meccanici">Meccanici</a>
            <a href="https://ersudriver.github.io/ersuoperator/rubrica_aziendale_v3">Rubrica</a>
        </div>
    </footer>

    <div id="testo-dinamico" class="scroll-hint">
        Buongiorno!
    </div>

    <main class="main-content">
        <div class="grid-item">
            <a href="https://drive.google.com/drive/u/0/folders/1r5QDvhz84Pn3EYgovvnQAvMo9kwJN0Z_" style="text-decoration:none; display:flex; flex-direction:column; align-items:center;">
                <img src="camaiore.png" alt="Camaiore">
                <span>Camaiore</span>
            </a>
        </div>

        <div class="grid-item">
            <a href="https://ersudriver.github.io/ersuoperator/#" style="text-decoration:none; display:flex; flex-direction:column; align-items:center;">
                <img src="fdm.png" alt="Forte dei Marmi">
                <span>Forte dei Marmi</span>
            </a>
        </div>

        <div class="grid-item">
            <a href="https://drive.google.com/drive/folders/1wpR4UX9MRdE1KE5xmvxzRI6-ZnjtYXbO" style="text-decoration:none; display:flex; flex-direction:column; align-items:center;">
                <img src="massarosa.png" alt="Massarosa">
                <span>Massarosa</span>
            </a>
        </div>

        <div class="grid-item">
            <a href="https://drive.google.com/drive/u/0/folders/17ZPAcVHmZygO3AwKNfkPIEgZfSrXhiv1" style="text-decoration:none; display:flex; flex-direction:column; align-items:center;">
                <img src="montignoso.png" alt="Montignoso">
                <span>Montignoso</span>
            </a>
        </div>

        <div class="grid-item">
            <a href="https://drive.google.com/drive/folders/1PMXmsSXfSTzlY-qTlGKgC5AEAp4cE6DM" style="text-decoration:none; display:flex; flex-direction:column; align-items:center;">
                <img src="pietrasanta.png" alt="Pietrasanta">
                <span>Pietrasanta</span>
            </a>
        </div>

        <div class="grid-item">
            <a href="https://ersudriver.github.io/ersuoperator/#" style="text-decoration:none; display:flex; flex-direction:column; align-items:center;">
                <img src="seravezza.png" alt="Seravezza">
                <span>Seravezza</span>
            </a>
        </div>

        <div class="grid-item">
            <a href="https://ersudriver.github.io/ersuoperator/#" style="text-decoration:none; display:flex; flex-direction:column; align-items:center;">
                <img src="stazzema.png" alt="Stazzema">
                <span>Stazzema</span>
            </a>
        </div>

        <div class="grid-item">
            <a href="https://ersudriver.github.io/ersuoperator/easteregg">
                <img src="vuoto.png" alt="vuoto">
            </a>
        </div>
    </main>

    <div class="visit-counter">
        <p>Visite totali:</p>
        <a href="https://www.hitwebcounter.com" target="_blank">
            <img src="https://hitwebcounter.com/counter/counter.php?page=10000001&style=0006&nbdigits=5&type=page&initCount=0" title="Counter" Alt="Visit Counter" border="0" />
        </a>                                    
    </div>

    <script>
        const frasi = [
            "le cartine su google drive sono a cura dei coordinatori",
            "in \"Rubrica\" puoi trovare numeri di telefono e codici vari",
            "scorri la pagina per vedere tutti i comuni",
            "sono disponibili: Camaiore, Pietrasanta, Massarosa e Montignoso",
            "Buongiorno!"
        ];

        const contenitore = document.getElementById('testo-dinamico');

        function cambiaFrase() {
            const indiceCasuale = Math.floor(Math.random() * frasi.length);
            contenitore.textContent = frasi[indiceCasuale];
        }

        setInterval(cambiaFrase, 5000);
    </script>

</body>
</html>
