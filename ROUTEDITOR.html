    function renderTratte() {
        const ul = document.getElementById('elencoTratte');
        ul.innerHTML = '';
        if (!segmenti.length) {
            ul.innerHTML = '<li><span class="nome-tratta">Nessuna tratta</span></li>';
            return;
        }
        segmenti.forEach((seg, i) => {
            const li = document.createElement('li');
            const selezionato = scambioNomeId === seg.id;
            li.innerHTML = `<span class="nome-tratta" data-id="${seg.id}" title="Vai alla tratta" style="color:${coloreTratta(seg, i)}">${escapeHtml(etichettaTratta(seg))}</span>` +
                `<span class="meta-tratta">${seg.punti.length} punti<br>${formatKm(lunghezzaSegmento(seg))}</span>` +
                (seg.nome ? `<button type="button" class="row-scambia${selezionato ? ' selezionato' : ''}" data-id="${seg.id}" title="Scambia il nome con un'altra tratta" aria-label="Scambia il nome con un'altra tratta">` +
                    `<svg viewBox="0 0 24 24"><path d="M4 8h14M15 5l3 3-3 3M20 16H6M9 13l-3 3 3 3"/></svg>` +
                `</button>` : '') +
                (corrente && seg.id === corrente.id ? `<button type="button" class="row-check" data-id="${seg.id}" title="Conferma la tratta in corso" aria-label="Conferma la tratta in corso">` +
                    `<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>` +
                `</button>` : '') +
                `<button type="button" class="row-x" data-id="${seg.id}" title="Elimina tratta" aria-label="Elimina tratta">×</button>`;
            ul.appendChild(li);
        });
    }

    function proiezione(p, a, b) {
        const dx = b.x - a.x, dy = b.y - a.y;
        const len2 = dx * dx + dy * dy;
        let t = len2 === 0 ? 0 : ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
        t = Math.max(0, Math.min(1, t));
        const px = a.x + t * dx, py = a.y + t * dy;
        return { d: Math.hypot(p.x - px, p.y - py), t };
    }

    function puntoVicino(latlng, escludiId = null) {
        const clickPt = map.latLngToContainerPoint(latlng);
        let migliore = null, dist = SNAP_PUNTO;
        punti.forEach(p => {
            if (p.id === escludiId) return;
            const d = clickPt.distanceTo(map.latLngToContainerPoint([p.lat, p.lng]));
            if (d < dist) { dist = d; migliore = p; }
        });
        return migliore;
    }

    function lineaVicino(latlng, escludiSegId = null, soloTratte = false, escludiDir = null) {
        const clickPt = map.latLngToContainerPoint(latlng);
        let segTrovato = null, dirTrovata = null, idxTrovato = -1, best = SNAP_LINEA, latTrovata = null, lngTrovata = null;
        const controlla = (ids, seg, dir) => {
            if (dir && dir === escludiDir) return;
            for (let i = 0; i < (ids || []).length - 1; i++) {
                const a = getPunto(ids[i]);
                const b = getPunto(ids[i + 1]);
                if (!a || !b) continue;
                const pa = map.latLngToContainerPoint([a.lat, a.lng]);
                const pb = map.latLngToContainerPoint([b.lat, b.lng]);
                const r = proiezione(clickPt, pa, pb);
                if (r.d < best) {
                    best = r.d;
                    segTrovato = seg;
                    dirTrovata = dir;
                    idxTrovato = i;
                    latTrovata = a.lat + (b.lat - a.lat) * r.t;
                    lngTrovata = a.lng + (b.lng - a.lng) * r.t;
                }
            }
        };
        segmenti.forEach(seg => {
            if (seg.id === escludiSegId) return;
            controlla((seg.punti || []).map(m => m.pid), seg, null);
            if (soloTratte) return;
            diramazioniRicorsive(seg).forEach(({ dir }) => controlla(puntiDiramazione(dir), seg, dir));
        });
        return segTrovato
            ? { seg: segTrovato, diramazione: dirTrovata, idx: idxTrovato, lat: latTrovata, lng: lngTrovata }
            : null;
    }

    function hitTest(latlng) {
        const p = puntoVicino(latlng);
        if (p) return { tipo: 'punto', punto: p };
        const l = lineaVicino(latlng);
        if (l) return Object.assign({ tipo: l.diramazione ? 'diramazione' : 'linea' }, l);
        return { tipo: 'vuoto' };
    }

    function creaPunto(latlng) {
        if (punti.length >= 999) {
            toast('Massimo 999 punti per percorso.');
            return null;
        }
        const p = { id: uid('p'), lat: latlng.lat, lng: latlng.lng, note: null, immagini: [] };
        punti.push(p);
        return p;
    }

    function inserisciPuntoIntermedio(hit) {
        const p = creaPunto({ lat: hit.lat, lng: hit.lng });
        if (!p) return null;
        p.senzaNumero = true;
        const mem = { pid: p.id, numero: '', notaNumero: null };
        if (hit.diramazione) {
            hit.diramazione.punti = Array.isArray(hit.diramazione.punti) ? hit.diramazione.punti : [];
            hit.diramazione.punti.splice(hit.idx, 0, mem);
        } else {
            hit.seg.punti.splice(hit.idx + 1, 0, mem);
        }
        rinumeriaTutti();
        return mem;
    }

    function risolviPunto(latlng) {
        const intermedio = corrente.punti.length > 0;
        const vicino = puntoVicino(latlng);
        if (vicino) {
            const già = corrente.punti.find(m => m.pid === vicino.id);
            if (già && corrente.punti[corrente.punti.length - 1] === già) return già;
            if (già) return già;
            const p = creaPunto({ lat: vicino.lat, lng: vicino.lng });
            if (!p) return null;
            if (intermedio) p.senzaNumero = true;
            const mem = { pid: p.id, numero: '' };
            corrente.punti.push(mem);
            rinumeriaTutti();
            return mem;
        }

        const hit = lineaVicino(latlng);
        if (hit) return inserisciPuntoIntermedio(hit);

        const p = creaPunto(latlng);
        if (!p) return null;
        if (intermedio) p.senzaNumero = true;
        const mem = { pid: p.id, numero: '' };
        corrente.punti.push(mem);
        rinumeriaTutti();
        return mem;
    }

    function aggiungiPunto(latlng) {
        if (!corrente) {
            const hit = lineaVicino(latlng);
            if (hit) {
                inserisciPuntoIntermedio(hit);
                disegnaEditor();
                renderTratte();
                toast('Punto intermedio aggiunto.');
                return;
            }
            toast('Fai doppio clic/tap su un\'area vuota per creare una nuova tratta.');
            return;
        }
        risolviPunto(latlng);
        disegnaEditor();
        renderTratte();
    }

    function eliminaAppartenenza(segId, pid) {
        const seg = segmenti.find(s => s.id === segId);
        if (!seg) return;
        const eraEstremo = seg.punti.length > 1 && (
            (seg.punti[0] && seg.punti[0].pid === pid) ||
            (seg.punti[seg.punti.length - 1] && seg.punti[seg.punti.length - 1].pid === pid)
        );
        let promuovi = null;
        if (eraEstremo) {
            const estremo = getPunto(pid);
            const intermedi = seg.punti
                .filter(m => m.pid !== pid)
                .map(m => ({ mem: m, p: getPunto(m.pid) }))
                .filter(x => x.p && x.p.senzaNumero && !x.p.etichetta);
            if (estremo && intermedi.length) {
                intermedi.sort((a, b) =>
                    Math.hypot(a.p.lat - estremo.lat, a.p.lng - estremo.lng) -
                    Math.hypot(b.p.lat - estremo.lat, b.p.lng - estremo.lng)
                );
                promuovi = intermedi[0].mem;
            }
        }
        seg.punti = seg.punti.filter(m => m.pid !== pid);
        const rimuoviDaDiramazioni = lista => (Array.isArray(lista) ? lista : []).map(d => {
            d.punti = (Array.isArray(d.punti) ? d.punti : []).filter(m => m.pid !== pid);
            d.diramazioni = rimuoviDaDiramazioni(d.diramazioni);
            return d;
        }).filter(d => d.a !== pid && d.b !== pid);
        seg.diramazioni = rimuoviDaDiramazioni(seg.diramazioni);
        if (promuovi) {
            const vecchioPid = promuovi.pid;
            const promosso = separaSeCondiviso(seg, promuovi);
            if (promosso) {
                promosso.senzaNumero = false;
                promosso.etichetta = '';
                const aggiornaDiramazioni = lista => (Array.isArray(lista) ? lista : []).forEach(d => {
                    if (d.a === vecchioPid) d.a = promosso.id;
                    if (d.b === vecchioPid) d.b = promosso.id;
                    (Array.isArray(d.punti) ? d.punti : []).forEach(m => {
                        if (m.pid === vecchioPid) m.pid = promosso.id;
                    });
                    aggiornaDiramazioni(d.diramazioni);
                });
                aggiornaDiramazioni(seg.diramazioni);
            }
        }
        pulisciDiramazioni();
        if (!seg.punti.length && !diramazioniRicorsive(seg).length) {
            eliminaTratta(segId);
            return;
        }
        rinumeriaTutti();
        const usati = puntiUsati();
        punti = punti.filter(p => usati.has(p.id));
        disegnaEditor();
        renderTratte();
        toast('Punto eliminato.');
    }

    function eliminaTratta(id) {
        const seg = segmenti.find(s => s.id === id);
        if (!seg) return;
        if (scambioNomeId === id) scambioNomeId = null;
        segmenti = segmenti.filter(s => s.id !== id);
        pulisciDiramazioni();
        const usati = puntiUsati();
        punti = punti.filter(p => usati.has(p.id));
        if (corrente === seg) {
            corrente = segmenti[segmenti.length - 1] || null;
            if (!corrente) {
                corrente = { id: uid('t'), nome: '', colore: prossimoColore(), stile: 'normale', punti: [] };
                segmenti.push(corrente);
            }
        }
        ordinaSegmenti();
        rinumeriaTutti();
        disegnaEditor();
        renderTratte();
        toast('Tratta eliminata.');
    }

    function finalizzaCorrente() {
        if (!corrente) return null;
        const seg = corrente;
        if (!seg.punti.length) {
            segmenti = segmenti.filter(s => s !== seg);
            pulisciDiramazioni();
            const usati = puntiUsati();
            punti = punti.filter(p => usati.has(p.id));
            corrente = null;
            disegnaEditor();
            renderTratte();
            return null;
        }
        const ultimo = seg.punti[seg.punti.length - 1];
        const p = getPunto(ultimo.pid);
        if (p && p.senzaNumero && !p.etichetta) {
            separaSeCondiviso(seg, ultimo).senzaNumero = false;
        }
        if (!seg.nome) seg.nome = prossimoNomeTratta();
        corrente = null;
        ordinaSegmenti();
        rinumeriaTutti();
        disegnaEditor();
        renderTratte();
        return seg;
    }

    function nuovaTratta(primoPunto = null) {
        if (layerSearch) layerSearch.clearLayers();
        searchMarker = null;
        finalizzaCorrente();
        corrente = { id: uid('t'), nome: '', colore: prossimoColore(), stile: 'normale', punti: [] };
        segmenti.push(corrente);
        ordinaSegmenti();
        if (primoPunto) risolviPunto(primoPunto);
        disegnaEditor();
        renderTratte();
        status('Nuova tratta: tocca i punti da aggiungere.');
        toast('Nuova tratta creata: la precedente è stata chiusa.');
    }

    function resetEditor(mostraMessaggio = true) {
        entraEditor();
        if (layerSearch) layerSearch.clearLayers();
        searchMarker = null;
        scambioNomeId = null;
        punti = [];
        segmenti = [];
        corrente = { id: uid('t'), nome: '', colore: prossimoColore(), stile: 'normale', punti: [] };
        segmenti.push(corrente);
        routeInModifica = null;
        routeAperta = null;
        disegnaEditor();
        renderTratte();
        if (mostraMessaggio) status('Tocca la mappa per aggiungere il primo punto.');
    }

    function entraEditor() {
        if (modo === 'viewer') {
            if (map.hasLayer(layerViewer)) map.removeLayer(layerViewer);
            layerViewer.clearLayers();
            lineeViewer = [];
            if (!map.hasLayer(layerEditor)) map.addLayer(layerEditor);
            modo = 'editor';
        }
        document.getElementById('btnSalva').hidden = false;
        document.getElementById('btnSalva').disabled = false;
        document.getElementById('btnTorna').hidden = true;
        document.getElementById('btnNote').hidden = true;
        document.getElementById('pannelloNote').hidden = true;
    }

    function entraViewer(route) {
        routeAperta = route;
        if (map.hasLayer(layerEditor)) map.removeLayer(layerEditor);
        if (!map.hasLayer(layerViewer)) map.addLayer(layerViewer);
        layerViewer.clearLayers();
        lineeViewer = [];
        modo = 'viewer';

        const gruppi = new Map();
        const aggiungiAlGruppo = item => {
            const chiave = `${item.p.lat.toFixed(6)},${item.p.lng.toFixed(6)}`;
            if (!gruppi.has(chiave)) gruppi.set(chiave, []);
            gruppi.get(chiave).push(item);
        };
        route.tratte.forEach((seg, i) => {
            const colore = coloreTratta(seg, i);
            const lista = seg.punti.map(m => puntoDiRoute(route, m.pid)).filter(Boolean);
            if (lista.length >= 2) {
                const latlngs = lista.map(p => [p.lat, p.lng]);
                opzioniLinea(seg, colore, { weight: 6 }).forEach(({ opzioni, offset }) => {
                    const linea = L.polyline(offsetLatLngs(latlngs, offset), opzioni).addTo(layerViewer);
                    lineeViewer.push({ linea, latlngs, offset });
                });
            }
            diramazioniRicorsive(seg).forEach(({ dir }) => {
                const path = puntiDiramazione(dir).map(id => puntoDiRoute(route, id)).filter(Boolean);
                if (path.length < 2) return;
                const latlngsDir = path.map(p => [p.lat, p.lng]);
                opzioniLinea(dir, colore, { weight: 4 }).forEach(({ opzioni, offset }) => {
                    const linea = L.polyline(offsetLatLngs(latlngsDir, offset), opzioni).addTo(layerViewer);
                    lineeViewer.push({ linea, latlngs: latlngsDir, offset });
                });
            });
            seg.punti.forEach(m => {
                const p = puntoDiRoute(route, m.pid);
                if (p) aggiungiAlGruppo({ p, numero: p.etichetta || m.numero || '00', colore, senzaNumero: !!p.senzaNumero && !p.etichetta, notaNumero: m.notaNumero });
            });
            diramazioniRicorsive(seg).forEach(({ dir }) => {
                (dir.punti || []).forEach(m => {
                    const p = puntoDiRoute(route, m.pid);
                    if (p) aggiungiAlGruppo({ p, numero: '', colore, senzaNumero: true, notaNumero: m.notaNumero });
                });
                const p = puntoDiRoute(route, dir.b);
                if (p) aggiungiAlGruppo({ p, numero: dir.etichetta || p.etichetta || '00', colore, senzaNumero: false, notaNumero: dir.notaNumero });
            });
        });
        gruppi.forEach(arr => {
            const passo = arr.some(item => item.senzaNumero) ? 10 : 24;
            const base = -((arr.length - 1) * passo) / 2;
            arr.forEach((item, i) => {
                const classe = 'pin' + (item.senzaNumero ? ' senza-numero' : '') + (item.p.note ? ' con-nota' : '');
                const triangolo = item.p.note ? htmlTriangoloNota(item.notaNumero) : '';
                L.marker([item.p.lat, item.p.lng], {
                    icon: L.divIcon({
                        className: 'pin-wrapper',
                        html: `<div class="${classe}" style="background:${item.colore}">${item.senzaNumero ? '' : escapeHtml(item.numero)}${triangolo}</div>`,
                        iconSize: item.senzaNumero ? [14, 14] : [34, 34],
                        iconAnchor: item.senzaNumero ? [7, 7 + base + i * passo] : [17, 17 + base + i * passo]
                    })
                }).bindTooltip(coordsTesto(item.p), { direction: 'top' }).addTo(layerViewer);
            });
        });

        document.getElementById('btnSalva').hidden = true;
        document.getElementById('btnSalva').disabled = true;
        document.getElementById('btnTorna').hidden = false;
        document.getElementById('btnNote').hidden = false;
        document.getElementById('pannelloNote').hidden = false;
        renderPannelloNote(route);
        status(`Visualizzazione: ${route.nome}`);
    }

    function caricaInModifica(route) {
        entraEditor();
        punti = route.punti.map(p => Object.assign({}, p, { immagini: [...(p.immagini || [])] }));
        segmenti = route.tratte.map((s, i) => ({
            id: s.id,
            nome: s.nome,
            colore: coloreTratta(s, i),
            stile: s.stile || 'normale',
            punti: s.punti.map(m => ({ ...m })),
            diramazioni: clonaDiramazioni(s.diramazioni)
        }));
        routeInModifica = route.id;
        corrente = segmenti[segmenti.length - 1] || null;
        if (!corrente) {
            corrente = { id: uid('t'), nome: '', colore: prossimoColore(), stile: 'normale', punti: [] };
            segmenti.push(corrente);
        }
        ordinaSegmenti();
        rinumeriaTutti();
        disegnaEditor();
        renderTratte();
        toast('Percorso caricato: puoi modificarlo.');
        status(`Modifica: ${route.nome}`);
    }

    function salvaPercorso() {
        finalizzaCorrente();
        const chiuse = segmenti.filter(s => s.punti.length >= 1);
        if (!chiuse.length) {
            toast('Crea almeno un punto prima di salvare.');
            return;
        }
        const esistente = routeInModifica ? percorsi.find(r => r.id === routeInModifica) : null;
        apriModal({
            titolo: esistente ? 'SALVA MODIFICHE' : 'SALVA PERCORSO',
            suggerimento: '',
            nome: esistente ? esistente.nome : '',
            categorie: true,
            comune: esistente ? esistente.comune : null,
            territorio: esistente ? esistente.territorio : null,
            veicoli: esistente ? esistente.veicoli : [],
            onConferma: dati => {
                const tratteFinali = segmenti.filter(s => s !== corrente && s.punti.length >= 1)
                    .map(s => ({
                        id: s.id,
                        nome: s.nome || 'Tratta',
                        colore: s.colore || null,
                        stile: s.stile || 'normale',
                        punti: s.punti.map(m => ({ pid: m.pid, numero: m.numero, notaNumero: m.notaNumero || null })),
                        diramazioni: serializzaDiramazioni(s.diramazioni)
                    }));
                if (!tratteFinali.length) { toast('Nessuna tratta da salvare.'); return; }
                const usati = new Set(tratteFinali.flatMap(t => t.punti.map(m => m.pid)));
                tratteFinali.forEach(t => diramazioniRicorsive(t).forEach(({ dir }) => {
                    puntiDiramazione(dir).forEach(id => usati.add(id));
                }));
                const puntiFinali = punti.filter(p => usati.has(p.id)).map(p => Object.assign({}, p, { immagini: [...(p.immagini || [])] }));
                const nome = dati.nome.trim() || 'Percorso senza nome';
                const comune = dati.comune;
                const territorio = dati.territorio || '';

                if (esistente) {
                    const vecchio = JSON.stringify(esistente);
                    esistente.nome = nome;
                    esistente.comune = comune;
                    esistente.territorio = territorio;
                    esistente.veicoli = dati.veicoli;
                    esistente.punti = puntiFinali;
                    esistente.tratte = tratteFinali;
                    esistente.modificato = new Date().toISOString();
                    if (!salvaPercorsi()) {
                        Object.assign(esistente, JSON.parse(vecchio));
                        return;
                    }
                    toast('Modifiche salvate.');
                } else {
                    const route = {
                        id: uid('r'),
                        nome,
                        comune,
                        territorio,
                        veicoli: dati.veicoli,
                        creato: new Date().toISOString(),
                        punti: puntiFinali,
                        tratte: tratteFinali
                    };
                    percorsi.push(route);
                    if (!salvaPercorsi()) { percorsi.pop(); return; }
                    toast('Percorso salvato.');
                }
                renderViewer();
                resetEditor();
            }
        });
    }

    function comprimiImmagine(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = reject;
            reader.onload = () => {
                const img = new Image();
                img.onerror = reject;
                img.onload = () => {
                    const max = 900;
                    let w = img.width, h = img.height;
                    if (Math.max(w, h) > max) {
                        const r = max / Math.max(w, h);
                        w = Math.round(w * r);
                        h = Math.round(h * r);
                    }
                    const c = document.createElement('canvas');
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(c.toDataURL('image/jpeg', 0.72));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function aggiungiFileImmagini(files) {
        for (const file of files) {
            if (!file.type.startsWith('image/')) continue;
            try {
                noteImages.push(await comprimiImmagine(file));
            } catch (e) {
                toast('Impossibile leggere un\'immagine.');
            }
        }
        renderNoteImages();
    }

    function salvaNota() {
        if (!notaPunto) return;

        if (!testo && !noteImages.length) {
            notaPunto.note = null;
            if (notaRef) delete notaRef.notaNumero;
        } else {
            notaPunto.note = { testo, immagini: [...noteImages] };
            if (notaRef && !notaRef.notaNumero) {
                notaRef.notaNumero = notaSeg ? prossimoNumeroNota(notaSeg) : 1;
            }
        }
        if (notaSeg) rinumeriaNoteTratta(notaSeg);

    function downloadBlob(blob, nome) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = nome;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function nomeFile(nome, est) {
        return nome.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.' + est;
    }

    function esportaJSON(route) {
        const dati = { versione: 1, percorsi: [route] };
        downloadBlob(new Blob([JSON.stringify(dati, null, 2)], { type: 'application/json' }), nomeFile(route.nome, 'json'));
        toast('JSON del percorso esportato.');
    }

    function esportaBackup() {

        toast('Backup JSON esportato.');
    }

    async function inviaSuGoogleDrive() {
        const nome = 'backup-percorsi.json';
        const blob = new Blob([JSON.stringify({ versione: 1, percorsi }, null, 2)], { type: 'application/json' });
        const file = typeof File === 'function' ? new File([blob], nome, { type: blob.type, lastModified: Date.now() }) : null;
        if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'Percorsi ERSU',
                    text: 'Percorsi salvati con ROUTEDITOR'
                });
                toast('Condivisione avviata: scegli Google Drive come destinazione.');
                return;
            } catch (e) {
                if (e && e.name === 'AbortError') return;
                downloadBlob(blob, nome);
                toast('Condivisione non riuscita: JSON scaricato per il caricamento manuale.');
                return;
            }
        }
        downloadBlob(blob, nome);
        window.open('https://drive.google.com/drive/u/0/my-drive', '_blank', 'noopener,noreferrer');
        toast('JSON scaricato: caricarlo manualmente su Google Drive.');
    }

    function importaBackup(file) {
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const dati = JSON.parse(reader.result);
                const lista = Array.isArray(dati) ? dati : dati.percorsi;
                if (!Array.isArray(lista)) throw new Error('Formato non valido');
                let aggiunti = 0;
                lista.forEach(r => {
                    const norm = normalizzaRoute(r);
                    if (!norm || !norm.id || !Array.isArray(norm.punti) || !Array.isArray(norm.tratte)) return;
                    if (percorsi.some(x => x.id === norm.id)) return;
                    percorsi.push(norm);
                    aggiunti++;
                });
                if (!salvaPercorsi()) return;
                renderViewer();
                toast(aggiunti ? `${aggiunti} percorsi importati.` : 'Nessun nuovo percorso importato.');
            } catch (e) {
                toast('File JSON non valido.');
            }
        };
        reader.readAsText(file);
    }

    function cercaIndirizzo(query) {
        clearTimeout(searchTimer);
        if (query.trim().length < 3) {
            document.getElementById('searchResults').hidden = true;
            return;
        }
        searchTimer = setTimeout(async () => {
            const box = document.getElementById('searchResults');
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=it&countrycodes=it&q=${encodeURIComponent(query.trim())}`;
                const res = await fetch(url, { headers: { 'Accept-Language': 'it' } });
                const risultati = await res.json();
                box.innerHTML = '';
                if (!Array.isArray(risultati) || !risultati.length) {
                    box.innerHTML = '<button type="button" disabled>Nessun risultato</button>';
                } else {
                    risultati.forEach(r => {
                        const b = document.createElement('button');
                        b.type = 'button';
                        b.dataset.lat = r.lat;
                        b.dataset.lon = r.lon;
                        b.textContent = r.display_name;
                        box.appendChild(b);
                    });
                }
                box.hidden = false;
            } catch (e) {
                box.innerHTML = '<button type="button" disabled>Ricerca non disponibile</button>';
                box.hidden = false;
            }
        }, 320);
    }

        }).addTo(layerSearch);
        document.getElementById('searchResults').hidden = true;
        document.getElementById('searchInput').value = '';
    }

    function latLngToWorld(lat, lng, z) {
        const n = 256 * Math.pow(2, z);
        const x = (lng + 180) / 360 * n;
        const r = lat * Math.PI / 180;
        const y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
        return { x, y };
    }

    function caricaImmagine(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = src;
        });
    }

    async function caricaTiles(tiles, urlFn) {
        const risultati = [];
        for (let i = 0; i < tiles.length; i += 6) {
            const batch = tiles.slice(i, i + 6);
            const ris = await Promise.all(batch.map(t =>
                caricaImmagine(urlFn(t)).then(img => ({ ...t, img })).catch(() => null)
            ));
            risultati.push(...ris.filter(Boolean));
        }
        return risultati;
    }

    async function disegnaSfondoTilesPdf(pdf, rect, z, centro) {
        const scala = 2;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(rect.w * scala);
        canvas.height = Math.round(rect.h * scala);
        const ctx = canvas.getContext('2d');
        ctx.scale(scala, scala);
        ctx.fillStyle = '#e8efd2';
        ctx.fillRect(0, 0, rect.w, rect.h);

        const originX = centro.x - rect.w / 2;
        const originY = centro.y - rect.h / 2;
        const tileZ = Math.min(19, z + 1);
        const tileSize = 256 / Math.pow(2, tileZ - z);
        const nTile = Math.pow(2, tileZ);
        const tx0 = Math.floor(originX / tileSize);
        const tx1 = Math.floor((originX + rect.w) / tileSize);
        const ty0 = Math.floor(originY / tileSize);
        const ty1 = Math.floor((originY + rect.h) / tileSize);
        const tiles = [];
        for (let ty = ty0; ty <= ty1; ty++) {
            if (ty < 0 || ty >= nTile) continue;
            for (let tx = tx0; tx <= tx1; tx++) {
                tiles.push({
                    z: tileZ,
                    tx: ((tx % nTile) + nTile) % nTile,
                    ty,
                    px: tx * tileSize - originX,
                    py: ty * tileSize - originY
                });
            }
        }
        const imgs = await caricaTiles(tiles, t => `https://tile.openstreetmap.org/${t.z}/${t.tx}/${t.ty}.png`);
        imgs.forEach(t => ctx.drawImage(t.img, t.px, t.py, tileSize, tileSize));
        if (imgs.length) {
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', rect.x, rect.y, rect.w, rect.h, undefined, 'FAST');
        }
        return imgs.length;
    }

    function testoAdattato(ctx, testo, maxW, size, peso) {
        let s = size;
        do {
            ctx.font = `${peso} ${s}px "Josefin Sans", sans-serif`;
            if (ctx.measureText(testo).width <= maxW) break;
            s -= 2;
        } while (s > 14);
        return s;
    }

    function scegliZoom(route, W, mapH, pad) {
        if (!route.punti.length) return 2;
        const b = espandiBounds(limitiPdf(route), 0);
        const north = b.north, south = b.south, west = b.west, east = b.east;
        for (let z = 19; z >= 2; z--) {
            const a = latLngToWorld(north, west, z);
            const b = latLngToWorld(south, east, z);
            if ((b.x - a.x) <= W - 2 * pad && (b.y - a.y) <= mapH - 2 * pad) return z;
        }
        return 2;
    }

    async function disegnaMappaPdf(route, canvas, top, mapH, W) {
        const ctx = canvas.getContext('2d');
        if (!route.punti.length) return null;

        const lats = route.punti.map(p => p.lat), lngs = route.punti.map(p => p.lng);
        let north = Math.max(...lats), south = Math.min(...lats);
        let west = Math.min(...lngs), east = Math.max(...lngs);
        if (north - south < 0.0008) { north += 0.0004; south -= 0.0004; }
        if (east - west < 0.0008) { east += 0.0004; west -= 0.0004; }

        const z = scegliZoom(route, W, mapH, 150);
        const tileZ = Math.min(19, z + 1);
        const scala = Math.pow(2, tileZ - z);
        const tileSize = 256 / scala;
        const centro = latLngToWorld((north + south) / 2, (west + east) / 2, z);
        const originX = centro.x - W / 2;
        const originY = centro.y - mapH / 2;

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, top, W, mapH);
        ctx.clip();
        ctx.translate(0, top);
        ctx.fillStyle = '#e8efd2';
        ctx.fillRect(0, 0, W, mapH);

        const nTile = Math.pow(2, tileZ);
        const tx0 = Math.floor(originX / tileSize);
        const tx1 = Math.floor((originX + W) / tileSize);
        const ty0 = Math.floor(originY / tileSize);
        const ty1 = Math.floor((originY + mapH) / tileSize);
        const tiles = [];
        for (let ty = ty0; ty <= ty1; ty++) {
            for (let tx = tx0; tx <= tx1; tx++) {
                if (ty < 0 || ty >= nTile) continue;
                tiles.push({
                    z: tileZ,
                    tx: ((tx % nTile) + nTile) % nTile,
                    ty,
                    px: tx * tileSize - originX,
                    py: ty * tileSize - originY
                });
            }
        }

        const imgs = await caricaTiles(tiles, t => `https://tile.openstreetmap.org/${t.z}/${t.tx}/${t.ty}.png`);
        imgs.forEach(t => ctx.drawImage(t.img, t.px, t.py, tileSize, tileSize));
        if (!imgs.length) {
            ctx.strokeStyle = 'rgba(44,96,61,0.18)';
            ctx.lineWidth = 2;
            for (let x = 0; x < W; x += 160) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, mapH); ctx.stroke(); }
            for (let y = 0; y < mapH; y += 160) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        }

        const ptCanvas = p => {
            const w = latLngToWorld(p.lat, p.lng, z);
            return { x: w.x - originX, y: w.y - originY };
        };

        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        route.tratte.forEach((seg, i) => {
            const colore = coloreTratta(seg, i);
            const puntiSeg = seg.punti.map(m => puntoDiRoute(route, m.pid)).filter(Boolean);
            const lista = puntiSeg.map(ptCanvas);
            if (lista.length >= 2) {
                const stile = seg.stile || 'normale';
                if (stile === 'normale') {
                    tracciaLineaCanvas(ctx, lista, colore, 10);
                } else {
                    tracciaLineaCanvas(ctx, offsetCanvas(lista, -6), colore, 5, stile === 'latoB');
                    tracciaLineaCanvas(ctx, offsetCanvas(lista, 6), colore, 5, stile === 'latoA');
                }
            }
            puntiSeg.forEach((punto, k) => {
                const p = lista[k];
                const piccolo = !!punto.senzaNumero;
                ctx.beginPath();
                ctx.arc(p.x, p.y, piccolo ? 5 : 13, 0, Math.PI * 2);
                if (piccolo) {
                    ctx.fillStyle = colore;
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = colore;
                    ctx.stroke();
                }
            });
        });

        ctx.fillStyle = 'rgba(255,255,255,0.86)';
        ctx.font = '600 22px "Josefin Sans", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('© OpenStreetMap contributors', 24, mapH - 22);
        ctx.restore();
        return { ctx, ptCanvas, z };
    }

    function disegnaStrisciaPdf(ctx, route, W, top) {
        ctx.fillStyle = '#1e4a2a';
        ctx.fillRect(0, 0, W, top);
        ctx.fillStyle = '#a4bb5b';
        ctx.fillRect(0, top - 7, W, 7);

        ctx.textBaseline = 'alphabetic';
        const left = 70;
        const right = W - 70;
        const meta = left + (right - left) * 0.63;

        ctx.textAlign = 'left';
        ctx.fillStyle = '#d4e68a';
        testoAdattato(ctx, `GIRO: ${route.nome}`, right - left - (right - meta) - 40, 76, '700');
        ctx.fillText(`GIRO: ${route.nome}`, left, 112);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        testoAdattato(ctx, formatKm(lunghezzaKm(route)), right - meta - 30, 64, '700');
        ctx.fillText(formatKm(lunghezzaKm(route)), right, 112);

        const sotto = route.territorio ? `${route.comune || ''} / ${route.territorio}` : (route.comune || '');
        ctx.textAlign = 'left';
        ctx.fillStyle = '#a4bb5b';
        testoAdattato(ctx, sotto, right - left - (right - meta) - 40, 44, '600');
        ctx.fillText(sotto, left, 205);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        testoAdattato(ctx, dataRotta(route.creato), right - meta - 30, 42, '600');
        ctx.fillText(dataRotta(route.creato), right, 205);
    }

    function wrapTesto(ctx, testo, maxW) {
        const parole = String(testo || '').split(/\s+/).filter(Boolean);
        const righe = [];
        let riga = '';
        parole.forEach(parola => {
            const prova = riga ? riga + ' ' + parola : parola;
            if (ctx.measureText(prova).width <= maxW || !riga) {
                riga = prova;
            } else {
                righe.push(riga);
                riga = parola;
            }
        });
        if (riga) righe.push(riga);
        return righe.length ? righe : [''];
    }

    function disegnaImmagineContenuta(ctx, img, x, y, maxW, maxH) {
        const r = Math.min(maxW / img.width, maxH / img.height);
        const w = img.width * r, h = img.height * r;
        ctx.drawImage(img, x + (maxW - w) / 2, y + (maxH - h) / 2, w, h);
    }

    function nuovaPaginaNote(W, H, top, titolo) {

    function rgbHex(hex) {
        const h = String(hex || '#000000').replace('#', '');
        return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }

    function setDrawHex(pdf, hex) {
        const c = rgbHex(hex);
        pdf.setDrawColor(c[0], c[1], c[2]);
    }

    function setFillHex(pdf, hex) {
        const c = rgbHex(hex);
        pdf.setFillColor(c[0], c[1], c[2]);
    }

    function setTextHex(pdf, hex) {
        const c = rgbHex(hex);

    }

    function worldToLatLng(x, y, z) {
        const n = 256 * Math.pow(2, z);
        return {
            lat: Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) * 180 / Math.PI,
            lng: x / n * 360 - 180
        };
    }

    function espandiBounds(bounds, frazione = 0.14) {
        const h = (bounds.north - bounds.south) * frazione;
        const w = (bounds.east - bounds.west) * frazione;
        return {
            north: bounds.north + h,
            south: bounds.south - h,
            west: bounds.west - w,
            east: bounds.east + w
        };
    }

    function limitiPdf(route) {
        const lats = route.punti.map(p => p.lat), lngs = route.punti.map(p => p.lng);
        let north = Math.max(...lats), south = Math.min(...lats);
        let west = Math.min(...lngs), east = Math.max(...lngs);
        if (north - south < 0.0008) { north += 0.0004; south -= 0.0004; }
        if (east - west < 0.0008) { east += 0.0004; west -= 0.0004; }
        return espandiBounds({ north, south, west, east });
    }

    function clipSegmentoPdf(a, b, rect) {
        let t0 = 0, t1 = 1;
        const dx = b.x - a.x, dy = b.y - a.y;
        const p = [-dx, dx, -dy, dy];
        const q = [a.x - rect.x, rect.x + rect.w - a.x, a.y - rect.y, rect.y + rect.h - a.y];
        for (let i = 0; i < 4; i++) {
            if (p[i] === 0) {
                if (q[i] < 0) return null;
            } else {
                const r = q[i] / p[i];
                if (p[i] < 0) {
                    if (r > t1) return null;
                    if (r > t0) t0 = r;
                } else {
                    if (r < t0) return null;
                    if (r < t1) t1 = r;
                }
            }
        }
        return [
            { x: a.x + t0 * dx, y: a.y + t0 * dy },
            { x: a.x + t1 * dx, y: a.y + t1 * dy }
        ];
    }

    function parseOsmXml(xml) {
        const doc = new DOMParser().parseFromString(xml, 'text/xml');
        if (doc.querySelector('parsererror')) return [];
        const nodes = new Map();
        doc.querySelectorAll('node').forEach(n => {
            nodes.set(n.getAttribute('id'), {
                lat: parseFloat(n.getAttribute('lat')),
                lng: parseFloat(n.getAttribute('lon'))
            });
        });
        const ways = [];
        doc.querySelectorAll('way').forEach(w => {
            const tags = {};
            w.querySelectorAll('tag').forEach(t => { tags[t.getAttribute('k')] = t.getAttribute('v'); });
            const geom = [];
            w.querySelectorAll('nd').forEach(nd => {
                const n = nodes.get(nd.getAttribute('ref'));
                if (n && Number.isFinite(n.lat) && Number.isFinite(n.lng)) geom.push(n);
            });
            if (geom.length > 1) ways.push({ tags, geom });
        });
        return ways;
    }

    async function caricaMappaVettoriale(bbox) {
        let { north, south, west, east } = bbox;
        north = Math.min(85, north);
        south = Math.max(-85, south);
        const area = (north - south) * (east - west);
        if (!Number.isFinite(area) || area <= 0) return [];
        if (area > 0.2) {
            const k = Math.sqrt(0.2 / area);
            const cLat = (north + south) / 2, cLng = (west + east) / 2;
            north = cLat + (north - south) * k / 2;
            south = cLat - (north - south) * k / 2;
            east = cLng + (east - west) * k / 2;
            west = cLng - (east - west) * k / 2;
        }
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);
        try {
            const url = `https://api.openstreetmap.org/api/0.6/map?bbox=${west},${south},${east},${north}`;
            const res = await fetch(url, { signal: controller.signal });
            if (!res.ok) return [];
            return parseOsmXml(await res.text());
        } catch (e) {
            return [];
        } finally {
            clearTimeout(timer);
        }
    }

    function stileWayOsm(tags) {
        const h = tags.highway;
        if (tags.natural === 'water' || tags.waterway === 'riverbank' || tags.landuse === 'reservoir') {
            return { tipo: 'area', fill: '#bcd9e8', stroke: '#a8cadd', ordine: 0 };
        }
        if (tags.natural === 'wood' || tags.landuse === 'forest' || tags.landuse === 'grass' ||
            tags.landuse === 'meadow' || tags.landuse === 'recreation_ground' ||
            ['park', 'garden', 'playground'].includes(tags.leisure)) {
            return { tipo: 'area', fill: '#d5e6b8', stroke: '#c3d8a4', ordine: 0 };
        }
        if (['residential', 'commercial', 'industrial', 'retail'].includes(tags.landuse)) {
            return { tipo: 'area', fill: '#e9e6d8', stroke: '#d9d5c5', ordine: 0 };
        }
        if (tags.building) {
            return { tipo: 'area', fill: '#ded9c9', stroke: '#c3bdaa', ordine: 1 };
        }
        if (tags.waterway) {
            return { tipo: 'linea', colore: '#8ec3dd', larghezza: 1.8, ordine: 2 };
        }
        if (tags.railway) {
            return { tipo: 'linea', colore: '#7f8c8d', larghezza: 0.9, dash: [3, 2], ordine: 3 };
        }
        if (h) {
            if (['motorway', 'trunk', 'primary', 'secondary'].includes(h)) {
                return { tipo: 'linea', colore: '#f3c36b', casing: '#ffffff', larghezza: 2.6, ordine: 4 };
            }
            if (['tertiary', 'unclassified', 'residential', 'living_street'].includes(h)) {
                return { tipo: 'linea', colore: '#ffffff', casing: '#d5d0bd', larghezza: 1.8, ordine: 4 };
            }
            if (['service', 'track'].includes(h)) {
                return { tipo: 'linea', colore: '#ffffff', casing: '#dcd8c6', larghezza: 1.1, ordine: 4 };
            }
            if (['footway', 'path', 'cycleway', 'pedestrian', 'steps'].includes(h)) {
                return { tipo: 'linea', colore: '#e0a95c', casing: '#ffffff', larghezza: 1, dash: [2, 2], ordine: 5 };
            }
            return { tipo: 'linea', colore: '#ffffff', casing: '#dcd8c6', larghezza: 1, ordine: 4 };
        }
        return null;
    }

    function percorsoChiusoPdf(pdf, pts) {
        if (!pts.length) return;
        pdf.moveTo(pts[0].x, pts[0].y);
        pts.slice(1).forEach(p => pdf.lineTo(p.x, p.y));
        pdf.close();
    }

    function disegnaLineePdf(pdf, segments, colore, larghezza, dash, casing) {
        if (!segments.length) return;
        pdf.setLineDashPattern([]);
        if (casing) {
            setDrawHex(pdf, casing);
            pdf.setLineWidth(larghezza + 1.5);
            segments.forEach(s => pdf.line(s[0].x, s[0].y, s[1].x, s[1].y));
        }
        setDrawHex(pdf, colore);
        pdf.setLineWidth(larghezza);
        pdf.setLineDashPattern(dash || []);
        segments.forEach(s => pdf.line(s[0].x, s[0].y, s[1].x, s[1].y));
        pdf.setLineDashPattern([]);
    }

    function disegnaPalliniPdf(pdf, segments, colore, raggio = 0.9, passo = 5) {
        if (!segments.length) return;
        const punti = [];
        segments.forEach(([a, b]) => {
            const len = Math.hypot(b.x - a.x, b.y - a.y);
            const n = Math.min(400, Math.max(1, Math.round(len / passo)));
            for (let i = 0; i <= n; i++) {
                const t = i / n;
                punti.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
            }
        });
        setFillHex(pdf, '#ffffff');
        punti.forEach(p => pdf.circle(p.x, p.y, raggio + 0.7, 'F'));
        setFillHex(pdf, colore);
        punti.forEach(p => pdf.circle(p.x, p.y, raggio, 'F'));
    }

    function segmentiVisibiliPdf(pts, rect) {
        const out = [];
        for (let i = 0; i < pts.length - 1; i++) {
            const c = clipSegmentoPdf(pts[i], pts[i + 1], rect);
            if (c) out.push(c);
        }
        return out;
    }

    function disegnaGrigliaVettorialePdf(pdf, rect) {
        pdf.setLineDashPattern([]);
        setDrawHex(pdf, '#dce3cd');
        pdf.setLineWidth(0.5);
        for (let x = rect.x; x <= rect.x + rect.w; x += 30) pdf.line(x, rect.y, x, rect.y + rect.h);
        for (let y = rect.y; y <= rect.y + rect.h; y += 30) pdf.line(rect.x, y, rect.x + rect.w, y);
    }

    async function caricaFontPdf(pdf) {
        if (!window.__josefinPdfBase64) {
            const url = 'https://raw.githubusercontent.com/google/fonts/main/ofl/josefinsans/JosefinSans%5Bwght%5D.ttf';
            const res = await fetch(url);
            if (!res.ok) throw new Error('Font Josefin Sans non disponibile');
            const bytes = new Uint8Array(await res.arrayBuffer());
            let bin = '';
            const pezzo = 0x8000;
            for (let i = 0; i < bytes.length; i += pezzo) {
                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + pezzo));
            }
            window.__josefinPdfBase64 = btoa(bin);
        }
        pdf.addFileToVFS('JosefinSans.ttf', window.__josefinPdfBase64);
        pdf.addFont('JosefinSans.ttf', 'Josefin', 'normal');
        pdf.addFont('JosefinSans.ttf', 'Josefin', 'bold');
    }

    function setFontPdf(pdf, peso) {
        pdf.setFont(window.__josefinPdfOk ? 'Josefin' : 'helvetica', peso);
    }

    function testoCanvas(ctx, testo, x, y, size, weight, colore, align = 'left') {
        ctx.font = `${weight} ${size}px "Josefin Sans", sans-serif`;
        ctx.fillStyle = colore;
        ctx.textAlign = align;
        ctx.fillText(String(testo), x, y);

    function testoAdattatoPdf(pdf, testo, maxW, size, peso) {
        let s = size;
        do {
            setFontPdf(pdf, peso);
            pdf.setFontSize(s);
            if (pdf.getTextWidth(testo) <= maxW) break;
            s -= 1;

    function disegnaTriangoloNotaPdf(pdf, cx, cy, numero, scala, ctxTesto = null) {
        setFillHex(pdf, '#f1c40f');
        setDrawHex(pdf, '#d35400');
        pdf.setLineWidth(0.7 * scala);

        );

    function intervalloTratta(seg) {
        const numeri = (seg.punti || [])
            .map(m => String(m.numero || ''))
            .filter(n => /^\d+$/.test(n));
        const primo = numeri[0] || '00';
        const ultimo = numeri[numeri.length - 1] || primo;
        return `${primo}-${ultimo}`;
    }

    function notePerTratta(route) {
        const gruppi = [];
        route.tratte.forEach((seg, i) => {
            const visti = new Set();
            const note = [];
            const aggiungi = (p, notaRef) => {
                if (!p || !notaValida(p.note) || visti.has(p.id)) return;
                visti.add(p.id);
                note.push({
                    p,
                    notaRef,
                    notaNumero: (notaRef && notaRef.notaNumero) || 1
                });
            };
            seg.punti.forEach(m => aggiungi(puntoDiRoute(route, m.pid), m));
            diramazioniRicorsive(seg).forEach(({ dir }) => {
                (dir.punti || []).forEach(m => aggiungi(puntoDiRoute(route, m.pid), m));
                aggiungi(puntoDiRoute(route, dir.b), dir);
            });
            note.sort((a, b) => a.notaNumero - b.notaNumero);
            if (note.length) gruppi.push({
                seg,
                nome: seg.nome || `Tratta ${i + 1}`,
                intervallo: intervalloTratta(seg),
                colore: coloreTratta(seg, i),
                note
            });
        });
        return gruppi;
    }

    async function disegnaMappaVettorialePdf(pdf, route, rect) {
        setFillHex(pdf, '#e8efd2');
        pdf.rect(rect.x, rect.y, rect.w, rect.h, 'F');

        const testiCanvasEl = document.createElement('canvas');
        testiCanvasEl.width = 540 * 4;
        testiCanvasEl.height = 960 * 4;
        const ctxTesti = testiCanvasEl.getContext('2d');
        ctxTesti.scale(4, 4);
        ctxTesti.textBaseline = 'alphabetic';

        const bounds = limitiPdf(route);
        const z = scegliZoom(route, rect.w, rect.h, 34);
        const centro = latLngToWorld((bounds.north + bounds.south) / 2, (bounds.west + bounds.east) / 2, z);
        const originX = centro.x - rect.w / 2;
        const originY = centro.y - rect.h / 2;
        const pt = ll => {
            const w = latLngToWorld(ll.lat, ll.lng, z);
            return { x: w.x - originX + rect.x, y: w.y - originY + rect.y };
        };
        const nw = worldToLatLng(originX, originY, z);
        const se = worldToLatLng(originX + rect.w, originY + rect.h, z);

        const area = (bounds.north - bounds.south) * (bounds.east - bounds.west);
        const usaTiles = z < 11 || area > 0.2;
        const tileCount = usaTiles ? await disegnaSfondoTilesPdf(pdf, rect, z, centro) : 0;
        const ways = usaTiles
            ? []
            : await caricaMappaVettoriale({ north: nw.lat, south: se.lat, west: nw.lng, east: se.lng });
        const disegnabili = ways.map(w => ({ ...w, stile: stileWayOsm(w.tags) }))
            .filter(w => w.stile)
            .sort((a, b) => a.stile.ordine - b.stile.ordine);

        if (!disegnabili.length && !tileCount) disegnaGrigliaVettorialePdf(pdf, rect);

        disegnabili.forEach(w => {
            const pts = w.geom.map(pt);
            if (w.stile.tipo === 'area') {
                if (pts.length < 3) return;
                setFillHex(pdf, w.stile.fill);
                percorsoChiusoPdf(pdf, pts);
                pdf.fill();
                setDrawHex(pdf, w.stile.stroke);
                pdf.setLineWidth(0.4);
                percorsoChiusoPdf(pdf, pts);
                pdf.stroke();
                return;
            }
            disegnaLineePdf(pdf, segmentiVisibiliPdf(pts, rect), w.stile.colore, w.stile.larghezza, w.stile.dash, w.stile.casing);
        });

        const gruppiPunti = new Map();
        const aggiungiGruppo = item => {
            const chiave = `${item.p.lat.toFixed(6)},${item.p.lng.toFixed(6)}`;
            if (!gruppiPunti.has(chiave)) gruppiPunti.set(chiave, []);
            gruppiPunti.get(chiave).push(item);
        };
        route.tratte.forEach((seg, i) => {
            const colore = coloreTratta(seg, i);
            const puntiSeg = seg.punti.map(m => puntoDiRoute(route, m.pid)).filter(Boolean);
            const lista = puntiSeg.map(pt);
            if (lista.length >= 2) {
                const stile = seg.stile || 'normale';
                if (stile === 'normale') {
                    disegnaLineePdf(pdf, segmentiVisibiliPdf(lista, rect), colore, 2.8, null, '#ffffff');
                } else if (stile === 'piedi') {
                    disegnaPalliniPdf(pdf, segmentiVisibiliPdf(lista, rect), colore, 1.2, 6);
                } else {
                    disegnaLineePdf(pdf, segmentiVisibiliPdf(offsetPunti(lista, -1.8, false), rect), colore, 1.5, stile === 'latoB' ? [4, 3] : null, '#ffffff');
                    disegnaLineePdf(pdf, segmentiVisibiliPdf(offsetPunti(lista, 1.8, false), rect), colore, 1.5, stile === 'latoA' ? [4, 3] : null, '#ffffff');
                }
            }
            diramazioniRicorsive(seg).forEach(({ dir }) => {
                const path = puntiDiramazione(dir).map(id => puntoDiRoute(route, id)).filter(Boolean);
                if (path.length < 2) return;
                const ptsDir = path.map(pt);
                const stileDir = dir.stile || 'normale';
                if (stileDir === 'piedi') {
                    disegnaPalliniPdf(pdf, segmentiVisibiliPdf(ptsDir, rect), colore, 0.9, 5);
                } else if (stileDir === 'normale') {
                    disegnaLineePdf(pdf, segmentiVisibiliPdf(ptsDir, rect), colore, 1.8, null, '#ffffff');
                } else {
                    disegnaLineePdf(pdf, segmentiVisibiliPdf(offsetPunti(ptsDir, -1.4, false), rect), colore, 1.3, stileDir === 'latoB' ? [4, 3] : null, '#ffffff');
                    disegnaLineePdf(pdf, segmentiVisibiliPdf(offsetPunti(ptsDir, 1.4, false), rect), colore, 1.3, stileDir === 'latoA' ? [4, 3] : null, '#ffffff');
                }
            });
            puntiSeg.forEach((punto, k) => {
                aggiungiGruppo({
                    p: punto,
                    pos: lista[k],
                    numero: punto.etichetta || seg.punti[k].numero || '00',
                    colore,
                    senzaNumero: !!punto.senzaNumero && !punto.etichetta,
                    notaNumero: seg.punti[k].notaNumero
                });
            });
            diramazioniRicorsive(seg).forEach(({ dir }) => {
                (dir.punti || []).forEach(m => {
                    const p = puntoDiRoute(route, m.pid);
                    if (p) aggiungiGruppo({
                        p,
                        pos: pt(p),
                        numero: '',
                        colore,
                        senzaNumero: true,
                        notaNumero: m.notaNumero
                    });
                });
                const p = puntoDiRoute(route, dir.b);
                if (p) aggiungiGruppo({
                    p,
                    pos: pt(p),
                    numero: dir.etichetta || p.etichetta || '00',
                    colore,
                    senzaNumero: false,
                    notaNumero: dir.notaNumero
                });
            });
        });

        gruppiPunti.forEach(arr => {
            const passo = arr.some(item => item.senzaNumero) ? 3 : 7.2;
            const base = -((arr.length - 1) * passo) / 2;
            arr.forEach((item, i) => {
                const cx = item.pos.x;
                const cy = item.pos.y + base + i * passo;
                if (cx < rect.x - 8 || cx > rect.x + rect.w + 8 || cy < rect.y - 8 || cy > rect.y + rect.h + 8) return;
                setFillHex(pdf, '#ffffff');
                pdf.circle(cx, cy, item.senzaNumero ? 2.1 : 4.6, 'F');
                setFillHex(pdf, item.colore);
                pdf.circle(cx, cy, item.senzaNumero ? 1.5 : 3.6, 'F');
                if (!item.senzaNumero) {
                    testoCanvas(ctxTesti, item.numero, cx, cy + 1.8, String(item.numero).length > 2 ? 4 : 5.1, 700, '#ffffff', 'center');
                }
                if (notaValida(item.p.note)) disegnaTriangoloNotaPdf(pdf, cx, cy, item.notaNumero, 1, ctxTesti);
            });
        });

        setFillHex(pdf, '#ffffff');
        pdf.rect(rect.x + 6, rect.y + rect.h - 16, 142, 12, 'F');
        testoCanvas(ctxTesti, '© OpenStreetMap contributors', rect.x + 10, rect.y + rect.h - 7, 6, 600, '#3c4b3d');
        pdf.setLineDashPattern([]);
        pdf.addImage(testiCanvasEl.toDataURL('image/png'), 'PNG', 0, 0, 540, 960, undefined, 'FAST');
    }

    function disegnaStrisciaPdfVettoriale(pdf, route, W, top) {
        const scala = 4;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(W * scala);
        canvas.height = Math.round(top * scala);
        const ctx = canvas.getContext('2d');
        ctx.scale(scala, scala);
        ctx.textBaseline = 'alphabetic';

        const font = (size, weight) => `${weight} ${size}px "Josefin Sans", sans-serif`;
        const adattaFont = (testo, maxW, size, weight) => {
            let s = size;
            do {
                ctx.font = font(s, weight);
                if (ctx.measureText(testo).width <= maxW || s <= 6) break;
                s -= 1;
            } while (true);
            return s;
        };
        const rettangoloArrotondato = (x, y, w, h, r) => {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        };

        ctx.fillStyle = '#1e4a2a';
        ctx.fillRect(0, 0, W, top);
        ctx.fillStyle = '#a4bb5b';
        ctx.fillRect(0, top - 2.1, W, 2.1);

        const left = 21, right = W - 21, meta = left + (right - left) * 0.63;
        const titolo = `GIRO: ${route.nome}`;
        const veicoli = Array.isArray(route.veicoli)
            ? route.veicoli.map(String).filter(v => VEICOLI.includes(v))
            : [];
        const badgePad = 6, badgeGap = 4, badgeH = 19;
        ctx.font = font(10, 700);
        const larghezzeBadge = veicoli.map(v => ctx.measureText(v).width + badgePad * 2);
        const larghezzaBadge = larghezzeBadge.reduce((a, b) => a + b, 0) + (veicoli.length ? (veicoli.length - 1) * badgeGap : 0);
        const larghezzaTitolo = Math.max(40, meta - left - 12 - (veicoli.length ? larghezzaBadge + 10 : 0));
        adattaFont(titolo, larghezzaTitolo, 23, 700);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#d4e68a';
        ctx.fillText(titolo, left, 33.6);

        let bx = left + ctx.measureText(titolo).width + 10;
        veicoli.forEach((v, i) => {
            const bw = larghezzeBadge[i];
            ctx.font = font(10, 700);
            ctx.fillStyle = '#a4bb5b';
            rettangoloArrotondato(bx, 14.5, bw, badgeH, 5.5);
            ctx.fill();
            ctx.fillStyle = '#1e4a2a';
            ctx.textAlign = 'left';
            ctx.fillText(v, bx + badgePad, 27.8);
            bx += bw + badgeGap;
        });

        const km = formatKm(lunghezzaKm(route));
        adattaFont(km, right - meta - 10, 19, 700);
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'right';
        ctx.fillText(km, right, 33.6);

        const sotto = route.territorio ? `${route.comune || ''} / ${route.territorio}` : (route.comune || '');
        adattaFont(sotto, meta - left - 12, 13, 600);
        ctx.fillStyle = '#a4bb5b';
        ctx.textAlign = 'left';
        ctx.fillText(sotto, left, 61.5);

        const data = dataRotta(route.creato);
        adattaFont(data, right - meta - 10, 12.5, 600);
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'right';
        ctx.fillText(data, right, 61.5);

        pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, W, top, undefined, 'FAST');
    }

    async function esportaPDF(route) {
        if (!window.jspdf || !window.jspdf.jsPDF) {
            toast('Libreria PDF non disponibile: controlla la connessione.');
            return;
        }
        if (!route.punti.length) { toast('Il percorso non ha punti.'); return; }
        await (document.fonts ? document.fonts.ready : Promise.resolve());

        const PDF = window.jspdf.jsPDF;
        const pdf = new PDF({ orientation: 'portrait', unit: 'pt', format: [540, 960], compress: true });
        try {
            await caricaFontPdf(pdf);
            window.__josefinPdfOk = true;
        } catch (e) {
            window.__josefinPdfOk = false;
        }
        pdf.setProperties({ title: route.nome, subject: 'Percorso ERSU', creator: 'ROUTEDITOR' });
        await disegnaMappaVettorialePdf(pdf, route, { x: 0, y: 78, w: 540, h: 882 });
        disegnaStrisciaPdfVettoriale(pdf, route, 540, 78);

        const W2 = 1800, H2 = 3200, TOP2 = 210, PAD = 90;
        const gruppiNote = notePerTratta(route);

        let correntePg = nuovaPaginaNote(W2, H2, TOP2, 'NOTE');
        let y = correntePg.y;
        const pagineNote = [];
        let ctx = correntePg.ctx;

        if (!gruppiNote.length) {
            ctx.fillStyle = '#2c603d';
            ctx.font = '600 48px "Josefin Sans", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Nessuna nota presente.', PAD, y + 40);
        }

        const nuovaPagina = titolo => {
            pagineNote.push(correntePg.canvas);
            correntePg = nuovaPaginaNote(W2, H2, TOP2, titolo);
            ctx = correntePg.ctx;
            y = correntePg.y;
        };

        for (const gruppo of gruppiNote) {
            const intestazioneH = 82;
            if (y + intestazioneH + 120 > H2 - 90) nuovaPagina('NOTE (SEGUE)');
            const coloreGruppo = gruppo.colore || '#1e4a2a';
            ctx.fillStyle = coloreGruppo;
            ctx.fillRect(PAD, y, W2 - 2 * PAD, 64);
            ctx.fillStyle = coloreContrasto(coloreGruppo);
            ctx.font = '700 38px "Josefin Sans", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(gruppo.intervallo, PAD + 24, y + 43);
            y += intestazioneH;

            for (const nota of gruppo.note) {
                const p = nota.p;
                const immagini = await Promise.all((p.note.immagini || []).map(src => caricaImmagine(src).catch(() => null)));
                const conImmagini = immagini.filter(Boolean);
                const larghezzaTesto = conImmagini.length ? W2 - 2 * PAD - 610 : W2 - 2 * PAD - 170;
                const testoNota = (p.note.testo || '').trim() || '—';
                ctx.font = '600 40px "Josefin Sans", sans-serif';
                const righe = wrapTesto(ctx, testoNota, larghezzaTesto);
                const hTesto = righe.length * 54;
                const hImg = conImmagini.length ? 300 : 0;
                const blockH = Math.max(hTesto, hImg) + 70;

                if (y + blockH > H2 - 90) {
                    nuovaPagina(`NOTE - TRATTA ${gruppo.nome}`);
                    ctx.fillStyle = coloreGruppo;
                    ctx.fillRect(PAD, y, W2 - 2 * PAD, 64);
                    ctx.fillStyle = coloreContrasto(coloreGruppo);
                    ctx.font = '700 38px "Josefin Sans", sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(`${gruppo.intervallo} (SEGUE)`, PAD + 24, y + 43);
                    y += intestazioneH;
                }

                const badgeX = PAD + 26, badgeY = y + 30;
                ctx.fillStyle = '#2c603d';
                ctx.beginPath();
                ctx.arc(badgeX, badgeY, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#d4e68a';
                ctx.font = '700 24px "Josefin Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(nota.notaNumero), badgeX, badgeY + 1);
                ctx.textBaseline = 'alphabetic';
                ctx.textAlign = 'left';

                ctx.fillStyle = '#2c603d';
                ctx.font = '600 40px "Josefin Sans", sans-serif';
                righe.forEach((riga, i) => ctx.fillText(riga, PAD + 60, y + 44 + i * 54));

                if (conImmagini.length) {
                    const imgX = W2 - PAD - 470;
                    const nMostrate = Math.min(3, conImmagini.length);
                    const slotW = 150, gap = 12;
                    conImmagini.slice(0, nMostrate).forEach((img, i) => {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(imgX + i * (slotW + gap), y, slotW, 260);
                        disegnaImmagineContenuta(ctx, img, imgX + i * (slotW + gap), y, slotW, 260);
                    });
                    if (conImmagini.length > nMostrate) {
                        ctx.fillStyle = '#2c603d';
                        ctx.font = '600 30px "Josefin Sans", sans-serif';
                        ctx.fillText(`+${conImmagini.length - nMostrate}`, imgX, y + 320);
                    }
                }

                ctx.strokeStyle = 'rgba(44,96,61,0.25)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(PAD, y + blockH - 45);
                ctx.lineTo(W2 - PAD, y + blockH - 45);
                ctx.stroke();
                y += blockH;
            }
        }
        pagineNote.push(correntePg.canvas);

        pagineNote.forEach(canvas => {
            pdf.addPage([540, 960], 'portrait');
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 540, 960, undefined, 'FAST');
        });
        pdf.save(nomeFile(route.nome, 'pdf'));
        toast('PDF esportato (9:16, alta risoluzione).');
    }

        await aggiungiFileImmagini(Array.from(e.target.files || []));
        e.target.value = '';
    });
    document.addEventListener('click', e => {
        const rm = e.target.closest('.nota-img-item button');
        if (rm) {
            e.preventDefault();
            noteImages.splice(parseInt(rm.dataset.i, 10), 1);
            renderNoteImages();
            return;
        }
        const res = e.target.closest('#searchResults button[data-lat]');
        if (res) {
            vaiARisultato(res.dataset.lat, res.dataset.lon);
            return;
        }
        if (!e.target.closest('#searchBar')) {
            document.getElementById('searchResults').hidden = true;
        }
    });

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => cercaIndirizzo(searchInput.value));
    searchInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const primo = document.querySelector('#searchResults button[data-lat]');
            if (primo) vaiARisultato(primo.dataset.lat, primo.dataset.lon);
        } else if (e.key === 'Escape') {
            document.getElementById('searchResults').hidden = true;
        }
    });
    document.getElementById('selComune').addEventListener('change', popolaTerritori);

    avviaTickerIstruzioni();
    iniziaMappa();
</script>
</body>
</html>
