<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor Percorsi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; max-width: 100%; overflow: hidden; }

        body {
            background: #e8efd2;
            color: #2c603d;
            font-family: 'Josefin Sans', sans-serif;
        }

        #mappa { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 0; }

        .search-bar {
            position: relative;
            flex: 0 1 300px;
            min-width: 150px;
            height: 48px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            border: 2px solid #2c603d;
            border-radius: 999px;
            background: rgba(255,255,255,0.97);
            box-shadow: 0 3px 12px rgba(0,0,0,0.28);
        }
        .search-bar > svg { width: 20px; height: 20px; flex-shrink: 0; }
        .search-bar input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            color: #2c603d;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        .search-bar input::placeholder { color: rgba(44,96,61,0.6); }
        .search-results {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            max-height: 260px;
            overflow: auto;
            background: #fff;
            border: 2px solid #2c603d;
            border-radius: 0.8rem;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        }
        .search-results[hidden] { display: none; }
        .search-results button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.55rem 0.7rem;
            border: none;
            border-bottom: 1px solid rgba(44,96,61,0.15);
            background: transparent;
            color: #2c603d;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .search-results button:last-child { border-bottom: none; }
        .search-results button:hover { background: rgba(164,187,91,0.25); }

        .toolbar-mappa {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1200;
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            justify-content: flex-end;
            align-items: center;
            max-width: calc(100vw - 24px);
        }

        .btn-ico {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #2c603d;
            border-radius: 50%;
            background: rgba(44,96,61,0.94);
            color: #d4e68a;
            cursor: pointer;
            transition: background 0.25s, color 0.25s, transform 0.25s;
        }
        button { box-shadow: none !important; }
        .btn-ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .btn-ico:hover:not(:disabled) { background: #1e4a2a; color: #ffffff; transform: translateY(-2px); }
        .btn-ico:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-ico.primary { background: #1e4a2a; color: #d4e68a; }
        .btn-ico.danger { background: #c0392b; border-color: #c0392b; color: #ffffff; }
        .btn-ico[hidden] { display: none; }
        .toolbar-mappa > .btn-ico, .search-bar > .btn-ico { flex: 0 0 48px; }
        .btn-ico.mini { width: 36px; height: 36px; border-radius: 0.65rem; }
        .btn-ico.mini svg { width: 17px; height: 17px; }

        .pannello-tratte {
            position: fixed;
            left: 12px;
            bottom: 46px;
            z-index: 1200;
            width: min(330px, calc(100vw - 24px));
            max-height: 38vh;
            overflow: auto;
            background: rgba(255,255,255,0.95);
            border: 2px solid #2c603d;
            border-radius: 1rem;
            padding: 0.7rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        .pannello-tratte[hidden] { display: none; }

        .pannello-note {
            position: fixed;
            right: 12px;
            top: 72px;
            bottom: 96px;
            z-index: 1200;
            width: min(360px, calc(100vw - 24px));
            overflow: auto;
            background: rgba(255,255,255,0.97);
            border: 2px solid #2c603d;
            border-radius: 1rem;
            padding: 0.8rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        .pannello-note[hidden] { display: none; }
        .pannello-head #titoloNote { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nota-gruppo { margin-bottom: 1rem; }
        .nota-intervallo {
            background: #1e4a2a;
            color: #d4e68a;
            border-radius: 0.5rem;
            padding: 0.35rem 0.55rem;
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.45rem;
            cursor: pointer;
        }
        .nota-intervallo:hover, .nota-riga:hover { background: rgba(44,96,61,0.08); }
        .nota-riga {
            display: grid;
            grid-template-columns: 30px 1fr;
            gap: 0.5rem;
            align-items: start;
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(44,96,61,0.15);
            cursor: pointer;
        }
        .nota-riga:last-child { border-bottom: none; }
        .nota-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #2c603d;
            color: #d4e68a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .nota-testo { font-size: 0.9rem; line-height: 1.35; white-space: pre-wrap; }
        .nota-mini-immagini { display: flex; gap: 4px; margin-top: 0.3rem; }
        .nota-mini-immagini img { width: 46px; height: 46px; object-fit: cover; border-radius: 0.3rem; border: 1px solid rgba(44,96,61,0.35); }

        .pannello-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .pannello-head .chiudi, .row-x {
            width: 28px;
            height: 28px;
            border: 2px solid #2c603d;
            border-radius: 50%;
            background: transparent;
            color: #2c603d;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .row-x { width: 24px; height: 24px; font-size: 0.95rem; border-color: #c0392b; color: #c0392b; }
        .row-check {
            width: 24px;
            height: 24px;
            border: 2px solid #2c603d;
            border-radius: 50%;
            background: transparent;
            color: #2c603d;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .row-check svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .row-check:hover { background: #2c603d; color: #ffffff; }
        .row-scambia {
            width: 24px;
            height: 24px;
            border: 2px solid #2c603d;
            border-radius: 50%;
            background: transparent;
            color: #2c603d;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .row-scambia svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .row-scambia.selezionato { background: #2c603d; color: #ffffff; }

        .status { display: none; }

        #elencoTratte { list-style: none; display: grid; gap: 0.45rem; }
        #elencoTratte li {
            display: flex;
            justify-content: space-between;
            gap: 0.6rem;
            align-items: center;
            background: rgba(164,187,91,0.18);
            border-radius: 0.6rem;
            padding: 0.5rem 0.7rem;
            font-size: 0.92rem;
        }
        #elencoTratte .nome-tratta { font-weight: 700; cursor: pointer; text-decoration: underline dotted transparent; }
        #elencoTratte .nome-tratta:hover { text-decoration-color: currentColor; }
        #elencoTratte .meta-tratta { font-size: 0.8rem; opacity: 0.85; text-align: right; margin-left: auto; }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(20,45,28,0.62);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .overlay[hidden] { display: none; }
        .finestra {
            background: #eef3df;
            border: 3px solid #2c603d;
            border-radius: 1.2rem;
            width: min(680px, 100%);
            max-height: 88vh;
            overflow: auto;
            padding: 1.2rem;
            box-shadow: 0 14px 40px rgba(0,0,0,0.35);
        }
        .finestra h2 { font-family: 'Josefin Sans', sans-serif; font-size: 1.6rem; margin-bottom: 0.5rem; }
        .finestra .suggerimento { font-size: 0.9rem; font-style: italic; min-height: 1.2rem; margin-bottom: 0.7rem; }
        .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        label { display: block; font-family: 'Josefin Sans', sans-serif; font-weight: 700; margin: 0.7rem 0 0.25rem; }
        input, select, textarea {
            width: 100%;
            padding: 0.65rem;
            border: 2px solid #2c603d;
            border-radius: 0.6rem;
            background: #fff;
            color: #2c603d;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
        }
        input:focus, select:focus, textarea:focus { outline: 2px solid #a4bb5b; }
        .veicoli-opzioni { display: flex; flex-wrap: wrap; gap: 0.45rem; }
        .veicoli-opzioni label {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin: 0;
            padding: 0.4rem 0.65rem;
            border: 2px solid #2c603d;
            border-radius: 999px;
            background: #fff;
            cursor: pointer;
        }
        .veicoli-opzioni input { width: auto; padding: 0; accent-color: #2c603d; }
        .veicoli-opzioni input:focus { outline: none; }
        .modal-buttons { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.1rem; }

        .nota-img-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .nota-img-item { position: relative; width: 96px; height: 96px; border: 2px solid #2c603d; border-radius: 0.5rem; overflow: hidden; }
        .nota-img-item img { width: 100%; height: 100%; object-fit: cover; }
        .nota-img-item button {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            background: #c0392b;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            line-height: 1;
        }
        .nota-add { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; }
        .nota-add span { opacity: 0.75; font-size: 0.85rem; }

        .testata-viewer {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }
        .testata-viewer .azioni { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .gruppo { margin-bottom: 1.1rem; }
        .gruppo-titolo {
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(44,96,61,0.35);
            padding-bottom: 0.2rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }
        .sotto-titolo {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 0.6rem 0 0.35rem;
            opacity: 0.8;
        }
        .route-card {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
            justify-content: space-between;
            background: rgba(164,187,91,0.2);
            border-radius: 0.7rem;
            padding: 0.6rem 0.75rem;
            margin-bottom: 0.4rem;
        }
        .route-card .route-info { cursor: pointer; font-weight: 700; flex: 1 1 180px; }
        .route-card .route-info small { display: block; font-weight: 400; opacity: 0.8; }
        .route-card .route-azioni { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .route-card .btn-ico { box-shadow: none; }
        .vuoto { text-align: center; padding: 1.5rem; font-style: italic; }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 46px;
            transform: translateX(-50%);
            z-index: 3000;
            background: #1e4a2a;
            color: #d4e68a;
            border: 2px solid #a4bb5b;
            border-radius: 0.8rem;
            padding: 0.7rem 1.1rem;
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 600;
            max-width: calc(100% - 2rem);
            text-align: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .toast[hidden] { display: none; }

        .pin-wrapper { background: transparent; border: none; }
        .pin {
            position: relative;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 2px 7px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .nota-tri {
            position: absolute;
            right: -10px;
            bottom: -9px;
            width: 24px;
            height: 24px;
            pointer-events: none;
        }
        .pin.senza-numero {
            width: 14px;
            height: 14px;
            border: none;
            font-size: 0;
        }
        .pin.senza-numero .nota-tri { right: -13px; bottom: -12px; }
        .leaflet-tooltip.punto-tooltip {
            background: rgba(255,255,255,0.96);
            border: 1px solid #2c603d;
            border-radius: 0.45rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            padding: 3px 8px;
            font-size: 11px;
            color: #2c603d;
        }
        .leaflet-tooltip.punto-tooltip::before { display: none; }
        .leaflet-tooltip.tratta-tooltip {
            background: rgba(30,74,42,0.94);
            border: 1px solid #a4bb5b;
            border-radius: 0.4rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 9px;
        }
        .leaflet-tooltip.tratta-tooltip::before { display: none; }

        .controllo-satellite {
            position: fixed;
            right: 12px;
            bottom: 44px;
            z-index: 1200;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 12px 5px 6px;
            border: 2px solid #2c603d;
            border-radius: 999px;
            background: rgba(255,255,255,0.96);
            box-shadow: 0 3px 12px rgba(0,0,0,0.25);
        }
        .controllo-satellite .btn-ico { box-shadow: none; border-radius: 50%; }
        .controllo-satellite .btn-ico.attivo { background: #d4e68a; color: #1e4a2a; }
        .controllo-satellite input[type="range"] {
            width: 128px;
            accent-color: #2c603d;
            cursor: pointer;
        }
        .controllo-satellite input[type="range"]:disabled { opacity: 0.4; cursor: default; }

        .ticker-istruzioni {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 34px;
            z-index: 1000;
            display: flex;
            align-items: center;
            overflow: hidden;
            background: #1e4a2a;
            border-top: 2px solid #a4bb5b;
            color: #d4e68a;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            pointer-events: none;
        }
        .ticker-traccia {
            display: flex;
            flex-wrap: nowrap;
            width: max-content;
            white-space: nowrap;
            will-change: transform;
            animation: scorrimentoTicker 90s linear infinite;
        }
        .ticker-item { display: inline-flex; align-items: center; padding: 0 1.4rem; }
        .ticker-item::after {
            content: '◆';
            margin-left: 2.8rem;
            color: #a4bb5b;
            font-size: 0.65rem;
        }
        @keyframes scorrimentoTicker {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        @keyframes dashTrattaCorrente {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -34px; }
        }
        .leaflet-interactive.tratta-corrente {
            animation: dashTrattaCorrente 0.9s linear infinite;
        }
        .leaflet-container { font-family: 'Josefin Sans', sans-serif; }

        .stile-opzioni { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin-top: 0.6rem; }
        .stile-opzione {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem;
            border: 2px solid #2c603d;
            border-radius: 0.6rem;
            background: #ffffff;
            color: #2c603d;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .stile-opzione.selezionato { background: rgba(164,187,91,0.4); border-color: #173a22; outline: 2px solid #2c603d; outline-offset: -3px; }
        .stile-opzione .anteprima { position: relative; display: block; width: 84px; height: 22px; flex-shrink: 0; }
        .stile-opzione .anteprima i {
            position: absolute;
            left: 2px;
            right: 2px;
            height: 7px;
            border-radius: 4px;
            background: var(--anteprima-colore, #2c603d);
        }
        .stile-opzione .anteprima i:first-child { top: 2px; }
        .stile-opzione .anteprima i:last-child { bottom: 2px; }
        .stile-opzione[data-stile="normale"] .anteprima i:last-child { display: none; }
        .stile-opzione[data-stile="latoA"] .anteprima i:last-child,
        .stile-opzione[data-stile="latoB"] .anteprima i:first-child {
            background: repeating-linear-gradient(90deg, var(--anteprima-colore, #2c603d) 0 7px, transparent 7px 12px);
        }
        .stile-opzione[data-stile="piedi"] .anteprima i { display: none; }
        .stile-opzione[data-stile="piedi"] .anteprima::after {
            content: '';
            position: absolute;
            left: 2px;
            right: 2px;
            top: 6px;
            height: 10px;
            background-image: radial-gradient(circle, var(--anteprima-colore, #2c603d) 0 2px, transparent 2.4px);
            background-size: 9px 10px;
            background-repeat: repeat-x;
        }

        .pin.scacchi {
            background: repeating-conic-gradient(#111 0% 25%, #fff 0% 50%) 50% / 16px 16px;
            border-color: #2c603d;
        }

        .loupe {
            position: fixed;
            width: 132px;
            height: 132px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--loupe-color, #2c603d);
            box-shadow: 0 6px 20px rgba(0,0,0,0.45);
            z-index: 1500;
            pointer-events: none;
            background: #e8efd2;
        }
        .loupe[hidden] { display: none; }
        #loupeMappa { width: 100%; height: 100%; position: relative; z-index: 0; }
        .loupe::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            background: var(--loupe-color, #2c603d);
            border: 2px solid var(--loupe-color, #2c603d);
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.9);
            pointer-events: none;
            z-index: 10000;
        }

        @media (max-width: 600px) {
            .toolbar-mappa { top: 8px; right: 8px; gap: 6px; }
            .btn-ico { width: 42px; height: 42px; }
            .toolbar-mappa > .btn-ico, .search-bar > .btn-ico { flex: 0 0 42px; }
            .btn-ico svg { width: 19px; height: 19px; }
            .search-bar { flex: 1 1 160px; min-width: 120px; height: 42px; }
            .pannello-tratte { left: 8px; bottom: 44px; width: calc(100vw - 16px); }
            .finestra { padding: 0.9rem; }
        }
    </style>
</head>
<body>

<div id="mappa"></div>

<div class="toolbar-mappa" id="toolbarEditor">
    <div class="search-bar" id="searchBar">
        <input type="text" id="searchInput" placeholder="Cerca un indirizzo" autocomplete="off" aria-label="Cerca un indirizzo">
        <div class="search-results" id="searchResults" hidden></div>
    </div>
    <button type="button" class="btn-ico" id="btnCerca" title="Cerca un indirizzo" aria-label="Cerca un indirizzo">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
    <button type="button" class="btn-ico" id="btnTratte" title="Elenco tratte" aria-label="Elenco tratte">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <button type="button" class="btn-ico" id="btnNote" title="Note del percorso" aria-label="Note del percorso" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const COLORI = ['#c0392b', '#2c603d', '#e67e22', '#2980b9', '#8e44ad', '#16a085', '#d35400', '#7f8c8d'];
    const VEICOLI = ['22', '35', '55', '75', '120', '180', '180+'];
    const COMUNI = {
        'camaiore': ['lido', 'centro+collina', 'capezzano'],
        'massarosa': ['centro+sterpeti', 'stiava+conca'],
        'pietrasanta': ['camp', 'capriglia', 'marina', 'suburbio', 'strettoia'],
        'stazzema': [],
        'forte dei marmi': [],
        'montignoso': [],
        'seravezza': []
    };
    const SNAP_PUNTO = 18;
    const SNAP_LINEA = 12;
    const CHIAVE_STORAGE = 'routeditor.percorsi.v1';
    const ISTRUZIONI = [
        'metti i punti in ORDINE di percorrenza del giro. puoi leggere i sensi unici',
        'crea il minor numero di TRATTE possibili, usa una TRATTA per ogni via, e i RAMI per i rientri (le tratte sono identificate dai numeri, i rami dalle lettere)',
        'metti i PUNTI in corrispondenza di incroci o punti da segnalare',
        'puoi creare delle NOTE per ogni punto',
        'puoi modificare lo STILE delle linee per specificare come si lavora su quella strada',
        'RICORDA: i percorsi che crei sono salvati in locale. devi ESPORTARLI una volta che hai finito.'
    ];

    let map, layerEditor, layerViewer, layerSearch;
    let punti = [];
    let segmenti = [];
    let corrente = null;
    let markerById = new Map();
    let lineeById = new Map();
    let lineeViewer = [];
    let lineeDiramazione = [];
    let modo = 'editor';
    let percorsi = caricaPercorsi();
    let callbackModal = null;
    let toastTimer = null;
    let clickTimer = null;
    let routeInModifica = null;
    let routeAperta = null;
    let notaPunto = null;
    let notaRef = null;
    let notaSeg = null;
    let noteImages = [];
    let loupeMap = null;
    let searchMarker = null;
    let searchTimer = null;
    let scambioNomeId = null;
    let segStile = null;
    let satelliteLayer = null;
    let satelliteAttivo = false;
    let branchDrag = null;
    let layerBranchPreview = null;
    let sopprimiClickFinoA = 0;

    function uid(pref) {
        return pref + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function normalizzaNumero(valore, indice) {
        const testo = String(valore == null || valore === '' ? '' : valore);
        if (/^\d+$/.test(testo)) return String(Number(testo)).padStart(2, '0');
        return testo || String(indice + 1).padStart(2, '0');
    }

    function notaValida(note) {
        return !!(note && (note.testo || (note.immagini && note.immagini.length)));
    }

    function etichettaLettera(indice) {
        let n = indice, testo = '';
        while (n > 0) {
            n--;
            testo = String.fromCharCode(65 + (n % 26)) + testo;
            n = Math.floor(n / 26);
        }
        return testo;
    }

    function etichettaSuffisso(valore) {
        const testo = String(valore == null ? '' : valore);
        const m = testo.match(/([a-z]+(?:\d+(?:\.\d+)*)?)$/i);
        return m ? m[1].toUpperCase() : '';
    }

    function nomeDiramazioneFiglia(padre, indice) {
        if (!padre) return etichettaLettera(indice);
        const base = etichettaSuffisso(padre.etichetta || padre.suffisso);
        return base + (/\d/.test(base) ? '.' : '') + indice;
    }

    function figliDiramazione(seg, padre) {
        if (padre) return Array.isArray(padre.diramazioni) ? padre.diramazioni : [];
        return seg && Array.isArray(seg.diramazioni) ? seg.diramazioni : [];
    }

    function diramazioniRicorsive(seg, padre = null, livello = 0) {
        const elenco = [];
        figliDiramazione(seg, padre).forEach(d => {
            if (!d) return;
            const info = { dir: d, seg, padre, livello };
            elenco.push(info);
            elenco.push(...diramazioniRicorsive(seg, d, livello + 1));
        });
        return elenco;
    }

    function clonaDiramazioni(lista) {
        return (Array.isArray(lista) ? lista : []).map(d => ({
            ...d,
            punti: (Array.isArray(d.punti) ? d.punti : []).map(m => ({ ...m })),
            diramazioni: clonaDiramazioni(d.diramazioni)
        }));
    }

    function serializzaDiramazioni(lista) {
        return (Array.isArray(lista) ? lista : []).map(d => ({
            a: d.a,
            b: d.b,
            punti: (Array.isArray(d.punti) ? d.punti : []).map(m => ({
                pid: m.pid,
                numero: m.numero || '',
                notaNumero: m.notaNumero || null
            })),
            suffisso: d.suffisso,
            etichetta: d.etichetta,
            stile: d.stile || 'normale',
            notaNumero: d.notaNumero || null,
            diramazioni: serializzaDiramazioni(d.diramazioni)
        }));
    }

    function distanzaLungoPercorso(ids, target, trovaPunto) {
        const percorso = (ids || []).filter(Boolean);
        const idx = percorso.indexOf(target);
        if (idx < 0) return Infinity;
        let distanza = 0;
        for (let i = 0; i < idx; i++) {
            const a = trovaPunto(percorso[i]);
            const b = trovaPunto(percorso[i + 1]);
            if (a && b) distanza += Math.hypot(b.lat - a.lat, b.lng - a.lng);
        }
        return distanza;
    }

    function rinominaListaDiramazioni(seg, lista, percorsoPadre, padre, trovaPunto, distanzaBase = 0) {
        const ordinate = (lista || []).slice().sort((a, b) => {
            const ea = distanzaLungoPercorso(percorsoPadre, a.a, trovaPunto);
            const eb = distanzaLungoPercorso(percorsoPadre, b.a, trovaPunto);
            const da = Number.isFinite(ea) ? distanzaBase + ea : 1e15;
            const db = Number.isFinite(eb) ? distanzaBase + eb : 1e15;
            return da - db || String(a.a).localeCompare(String(b.a)) || String(a.b).localeCompare(String(b.b));
        });
        ordinate.forEach((d, i) => {
            const nome = nomeDiramazioneFiglia(padre, i + 1);
            d.suffisso = nome;
            d.etichetta = nome;
            const p = trovaPunto(d.b);
            if (p) {
                p.etichetta = nome;
                p.diramazione = true;
                p.senzaNumero = false;
            }
            const distanzaPropria = distanzaLungoPercorso(percorsoPadre, d.a, trovaPunto);
            rinominaListaDiramazioni(
                seg,
                d.diramazioni,
                puntiDiramazione(d),
                d,
                trovaPunto,
                Number.isFinite(distanzaPropria) ? distanzaBase + distanzaPropria : distanzaBase
            );
        });
    }

    function rinominaDiramazioni(seg, trovaPunto = getPunto) {
        if (!seg) return;
        seg.diramazioni = Array.isArray(seg.diramazioni) ? seg.diramazioni : [];
        rinominaListaDiramazioni(
            seg,
            seg.diramazioni,
            (seg.punti || []).map(m => m.pid),
            null,
            trovaPunto
        );
    }

    function prossimaDiramazione(seg, padre = null) {
        const lista = figliDiramazione(seg, padre);
        const usati = new Set(lista.map(d => etichettaSuffisso(d.suffisso || d.etichetta)).filter(Boolean));
        for (let i = 1; i <= 702; i++) {
            const nome = nomeDiramazioneFiglia(padre, i);
            if (!usati.has(nome)) return { suffisso: nome, etichetta: nome };
        }
        return null;
    }

    function prossimoNumeroNota(seg) {
        const usati = new Set();
        (seg.punti || []).forEach(m => { if (m.notaNumero) usati.add(Number(m.notaNumero)); });
        diramazioniRicorsive(seg).forEach(({ dir }) => {
            if (dir.notaNumero) usati.add(Number(dir.notaNumero));
            (dir.punti || []).forEach(m => { if (m.notaNumero) usati.add(Number(m.notaNumero)); });
        });
        for (let i = 1; i <= 9; i++) if (!usati.has(i)) return i;
        return usati.size + 1;
    }

    function puntoOrigineNote(seg, trovaPunto = getPunto) {
        const numerati = (seg.punti || []).map(m => ({ m, p: trovaPunto(m.pid) }))
            .filter(x => x.p && /^\d+$/.test(String(x.m.numero || '')));
        if (!numerati.length) {
            const primo = (seg.punti || [])[0];
            return primo ? trovaPunto(primo.pid) : null;
        }
        numerati.sort((a, b) => Number(a.m.numero) - Number(b.m.numero));
        return numerati[0].p;
    }

    function rinumeriaNoteTratta(seg, trovaPunto = getPunto) {
        if (!seg) return;
        const origine = puntoOrigineNote(seg, trovaPunto);
        if (!origine) return;
        const riferimenti = [];
        const visti = new Set();
        const aggiungi = (rif, pid) => {
            if (!rif || !pid || visti.has(pid)) return;
            const p = trovaPunto(pid);
            if (!p || !notaValida(p.note)) return;
            visti.add(pid);
            riferimenti.push({ rif, p });
        };
        (seg.punti || []).forEach(m => aggiungi(m, m.pid));
        diramazioniRicorsive(seg).forEach(({ dir }) => {
            (dir.punti || []).forEach(m => aggiungi(m, m.pid));
            aggiungi(dir, dir.b);
        });
        riferimenti.sort((a, b) => {
            const da = Math.hypot(a.p.lat - origine.lat, a.p.lng - origine.lng);
            const db = Math.hypot(b.p.lat - origine.lat, b.p.lng - origine.lng);
            return da - db;
        });
        riferimenti.forEach(({ rif }, i) => { rif.notaNumero = i + 1; });
    }

    function htmlTriangoloNota(numero) {
        const n = Number(numero) || 1;
        return `<svg class="nota-tri" viewBox="0 0 24 24" aria-hidden="true">` +
            `<polygon points="12,2.5 22,21 2,21" fill="#f1c40f" stroke="#d35400" stroke-width="2.5" stroke-linejoin="round"/>` +
            `<text x="12" y="18.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#7a3b00">${n}</text>` +
            `</svg>`;
    }

    function escapeHtml(t) {
        return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function coordsTesto(p) {
        return `${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`;
    }

    function puntoDiRoute(route, pid) {
        return route.punti.find(p => p.id === pid) || null;
    }

    function numeroPerRoute(route, pid) {
        for (const seg of route.tratte) {
            const m = seg.punti.find(x => x.pid === pid);
            if (!m) continue;
            const p = puntoDiRoute(route, pid);
            if (p && p.etichetta) return p.etichetta;
            return (p && p.senzaNumero) ? '•' : (m.numero || '00');
        }
        return '00';
    }

    function normalizzaRoute(r) {
        if (!r || typeof r !== 'object') return null;
        const lista = Array.isArray(r.punti) ? r.punti : [];
        const numeriVecchi = {};
        lista.forEach((p, i) => { numeriVecchi[p.id] = normalizzaNumero(p.numero, i); });
        r.punti = lista.map(p => ({
            id: p.id,
            lat: p.lat,
            lng: p.lng,
            note: p.note || null,
            immagini: Array.isArray(p.immagini) ? [...p.immagini] : [],
            senzaNumero: !!p.senzaNumero,
            etichetta: etichettaSuffisso(p.etichetta),
            diramazione: !!p.diramazione
        }));
        const presenti = new Set(r.punti.map(p => p.id));
        r.tratte = Array.isArray(r.tratte) ? r.tratte : [];
        r.tratte.forEach(seg => {
            seg.colore = seg.colore || null;
            seg.stile = seg.stile || 'normale';
            seg.punti = (Array.isArray(seg.punti) ? seg.punti : []).map((m, i) => {
                if (typeof m === 'string') return { pid: m, numero: normalizzaNumero(numeriVecchi[m], i), notaNumero: null };
                return {
                    pid: m.pid,
                    numero: normalizzaNumero(m.numero || numeriVecchi[m.pid], i),
                    notaNumero: m.notaNumero || null
                };
            }).filter(m => m.pid && presenti.has(m.pid));
            const normalizzaListaDiramazioni = (lista, validiPadre) =>
                (Array.isArray(lista) ? lista : []).map(d => {
                    const suffisso = etichettaSuffisso(d.suffisso || d.etichetta);
                    const intermedi = (Array.isArray(d.punti) ? d.punti : [])
                        .filter(m => m && m.pid && presenti.has(m.pid))
                        .map(m => ({ pid: m.pid, numero: '', notaNumero: m.notaNumero || null }));
                    const dir = {
                        a: d.a,
                        b: d.b,
                        punti: intermedi,
                        suffisso,
                        etichetta: suffisso,
                        stile: d.stile || 'normale',
                        notaNumero: d.notaNumero || null,
                        diramazioni: []
                    };
                    dir.diramazioni = normalizzaListaDiramazioni(d.diramazioni, new Set(puntiDiramazione(dir)));
                    return dir;
                }).filter(d =>
                    d.a && d.b && presenti.has(d.a) && presenti.has(d.b) && validiPadre.has(d.a)
                );
            seg.diramazioni = normalizzaListaDiramazioni(seg.diramazioni, new Set(seg.punti.map(m => m.pid)));
            rinominaDiramazioni(seg, id => r.punti.find(p => p.id === id));

            rinumeriaNoteTratta(seg, id => r.punti.find(p => p.id === id));
        });
        const veicoliPresenti = Array.isArray(r.veicoli) ? r.veicoli.map(String) : [];
        r.veicoli = VEICOLI.filter(v => veicoliPresenti.includes(v));
        if (!r.creato) r.creato = new Date().toISOString();
        return r;
    }

    function toast(messaggio) {
        const el = document.getElementById('toast');
        el.textContent = messaggio;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.hidden = true; }, 3400);
    }

    function status(messaggio) {
        document.getElementById('status').textContent = messaggio;
    }

    function avviaTickerIstruzioni() {
        const traccia = document.getElementById('tickerTraccia');
        if (!traccia || !ISTRUZIONI.length) return;
        const inizio = Math.floor(Math.random() * ISTRUZIONI.length);
        const sequenza = ISTRUZIONI.map((_, i) => ISTRUZIONI[(inizio + i) % ISTRUZIONI.length]);
        traccia.innerHTML = '';
        traccia.style.animation = 'none';
        for (let copia = 0; copia < 2; copia++) {
            sequenza.forEach(testo => {
                const item = document.createElement('span');
                item.className = 'ticker-item';
                item.textContent = testo;
                traccia.appendChild(item);
            });
        }
        void traccia.offsetWidth;
        traccia.style.animation = '';
        requestAnimationFrame(() => {
            const larghezza = traccia.scrollWidth / 2;
            traccia.style.animationDuration = Math.max(45, Math.round(larghezza / 70)) + 's';
        });
    }

    function getPunto(id) {
        return punti.find(p => p.id === id) || null;
    }

    function getMem(seg, pid) {
        return seg.punti.find(m => m.pid === pid) || null;
    }

    function riferimentoNotaPerPunto(seg, pid) {
        const mem = getMem(seg, pid);
        if (mem) return mem;
        for (const { dir } of diramazioniRicorsive(seg)) {
            if (dir.b === pid) return dir;
            const inter = (dir.punti || []).find(m => m.pid === pid);
            if (inter) return inter;
        }
        return null;
    }

    function puntiDiramazione(d) {
        if (!d) return [];
        const ids = [];
        if (d.a) ids.push(d.a);
        (Array.isArray(d.punti) ? d.punti : []).forEach(m => {
            if (m && m.pid) ids.push(m.pid);
        });
        if (d.b) ids.push(d.b);
        return ids;
    }

    function puntiUsati() {
        const usati = new Set(segmenti.flatMap(s => s.punti.map(m => m.pid)));
        segmenti.forEach(s => diramazioniRicorsive(s).forEach(({ dir }) => {
            puntiDiramazione(dir).forEach(id => usati.add(id));
        }));
        return usati;
    }

    function pulisciListaDiramazioni(lista, validiPadre, presenti) {
        return (Array.isArray(lista) ? lista : []).map(d => {
            d.punti = (Array.isArray(d.punti) ? d.punti : []).filter(m => m && presenti.has(m.pid));
            d.diramazioni = pulisciListaDiramazioni(d.diramazioni, new Set(puntiDiramazione(d)), presenti);
            return d;
        }).filter(d => d && presenti.has(d.a) && presenti.has(d.b) && validiPadre.has(d.a));
    }

    function pulisciDiramazioni() {
        const presenti = new Set(punti.map(p => p.id));
        segmenti.forEach(seg => {
            seg.diramazioni = pulisciListaDiramazioni(
                seg.diramazioni,
                new Set(seg.punti.map(m => m.pid)),
                presenti
            );
        });
    }

    function rinumeriaTutti() {
        let n = 1;
        segmenti.forEach(seg => rinominaDiramazioni(seg));
        segmenti.forEach(seg => {
            seg.punti.forEach(m => {
                const p = getPunto(m.pid);
                if (p && (p.senzaNumero || p.etichetta)) {
                    m.numero = p.etichetta || '';
                    return;
                }
                m.numero = String(n++).padStart(2, '0');
            });
        });
        segmenti.forEach(seg => rinumeriaNoteTratta(seg));
    }

    function coloreTratta(seg, i) {
        return (seg && seg.colore) || COLORI[((i == null ? 0 : i) % COLORI.length + COLORI.length) % COLORI.length];
    }

    function prossimoColore() {
        const usati = new Set(segmenti.map(s => s.colore).filter(Boolean));
        return COLORI.find(c => !usati.has(c)) || COLORI[segmenti.length % COLORI.length];
    }

    function coloreContrasto(hex) {
        const testo = String(hex || '').replace('#', '');
        if (testo.length < 6) return '#ffffff';
        const r = parseInt(testo.slice(0, 2), 16) || 0;
        const g = parseInt(testo.slice(2, 4), 16) || 0;
        const b = parseInt(testo.slice(4, 6), 16) || 0;
        const luminanza = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luminanza > 0.62 ? '#173a22' : '#ffffff';
    }

    function puntiInquadraturaTratta(seg, trovaPunto) {
        const ids = new Set((seg && seg.punti ? seg.punti : []).map(m => m.pid).filter(Boolean));
        if (seg) diramazioniRicorsive(seg).forEach(({ dir }) => {
            puntiDiramazione(dir).forEach(id => { if (id) ids.add(id); });
        });
        return [...ids].map(trovaPunto).filter(Boolean);
    }

    function opzioniInquadratura() {
        const noteAperte = modo === 'viewer' && !document.getElementById('pannelloNote').hidden;
        const tratteAperte = modo === 'editor' && !document.getElementById('pannelloTratte').hidden;
        return {
            paddingTopLeft: [tratteAperte ? 350 : 70, 70],
            paddingBottomRight: [noteAperte ? 380 : 70, 70],
            maxZoom: 18,
            duration: 0.9
        };
    }

    function inquadraTratta(seg, trovaPunto = getPunto) {
        const elenco = puntiInquadraturaTratta(seg, trovaPunto);
        if (!elenco.length) return;
        if (elenco.length === 1) {
            map.flyTo([elenco[0].lat, elenco[0].lng], 18, opzioniInquadratura());
            return;
        }
        const bounds = L.latLngBounds(elenco.map(p => [p.lat, p.lng]));
        map.flyToBounds(bounds, opzioniInquadratura());
    }

    function inquadraPunto(p) {
        if (!p) return;
        map.flyTo([p.lat, p.lng], 18, opzioniInquadratura());
    }

    function numeriDelPunto(pid) {
        const lista = [];
        segmenti.forEach(seg => {
            const m = getMem(seg, pid);
            if (m && m.numero) lista.push(m.numero);
        });
        return [...new Set(lista)].sort();
    }

    function caricaPercorsi() {
        try {
            const raw = localStorage.getItem(CHIAVE_STORAGE);
            const dati = raw ? JSON.parse(raw) : [];
            return Array.isArray(dati) ? dati.map(normalizzaRoute).filter(Boolean) : [];
        } catch (e) {
            return [];
        }
    }

    function salvaPercorsi() {
        try {
            localStorage.setItem(CHIAVE_STORAGE, JSON.stringify(percorsi));
            return true;
        } catch (e) {
            toast('Memoria insufficiente: prova con immagini più piccole.');
            return false;
        }
    }

    function nomeTratta(indice) {
        const lettera = String.fromCharCode(65 + Math.floor(indice / 9));
        return lettera + ((indice % 9) + 1);
    }

    function prossimoNomeTratta() {
        const usati = new Set(segmenti.filter(s => s !== corrente && s.nome).map(s => s.nome));
        for (let i = 0; i < 10000; i++) {
            const nome = nomeTratta(i);
            if (!usati.has(nome)) return nome;
        }
        return nomeTratta(segmenti.length);
    }

    function ordinaSegmenti() {
        segmenti.sort((a, b) => {
            if (!a.nome && !b.nome) return 0;
            if (!a.nome) return 1;
            if (!b.nome) return -1;
            return a.nome.localeCompare(b.nome, 'en');
        });
    }

    function nomeSegmento(seg) {
        if (seg.nome) return seg.nome;
        return seg === corrente ? prossimoNomeTratta() : nomeTratta(segmenti.indexOf(seg));
    }

    function etichettaTratta(seg) {
        const base = nomeSegmento(seg);
        return seg === corrente ? `In corso ${base}` : base;
    }

    function scambiaNomi(idA, idB) {
        const a = segmenti.find(s => s.id === idA);
        const b = segmenti.find(s => s.id === idB);
        if (!a || !b || a === b) return;
        const nomeA = nomeSegmento(a);
        const nomeB = nomeSegmento(b);
        const coloreA = coloreTratta(a, segmenti.indexOf(a));
        const coloreB = coloreTratta(b, segmenti.indexOf(b));
        a.nome = nomeB;
        b.nome = nomeA;
        a.colore = coloreB;
        b.colore = coloreA;
        scambioNomeId = null;
        ordinaSegmenti();
        rinumeriaTutti();
        disegnaEditor();
        renderTratte();
        toast('Nomi delle tratte scambiati.');
    }

    function coloraTooltip(layer, colore) {
        layer.on('tooltipopen', e => {
            const el = e.tooltip && e.tooltip.getElement();
            if (!el) return;
            el.style.background = colore;
            el.style.borderColor = colore;
        });
    }

    function applicaSatellite() {
        const slider = document.getElementById('satelliteOpacity');
        const pulsante = document.getElementById('satelliteToggle');
        if (!slider || !pulsante) return;
        slider.disabled = !satelliteAttivo;
        pulsante.classList.toggle('attivo', satelliteAttivo);
        pulsante.setAttribute('aria-pressed', String(satelliteAttivo));
        pulsante.title = satelliteAttivo ? 'Disattiva vista satellitare' : 'Attiva vista satellitare';
        if (satelliteLayer) satelliteLayer.setOpacity(satelliteAttivo ? Number(slider.value) / 100 : 0);
    }

    function hitSuPercorso(latlng, ids, seg, dir = null) {
        const clickPt = map.latLngToContainerPoint(latlng);
        let migliore = null, dist = Infinity;
        for (let i = 0; i < (ids || []).length - 1; i++) {
            const a = getPunto(ids[i]);
            const b = getPunto(ids[i + 1]);
            if (!a || !b) continue;
            const pa = map.latLngToContainerPoint([a.lat, a.lng]);
            const pb = map.latLngToContainerPoint([b.lat, b.lng]);
            const r = proiezione(clickPt, pa, pb);
            if (r.d < dist) {
                dist = r.d;
                migliore = {
                    seg,
                    diramazione: dir,
                    idx: i,
                    lat: a.lat + (b.lat - a.lat) * r.t,
                    lng: a.lng + (b.lng - a.lng) * r.t
                };
            }
        }
        return migliore;
    }

    function hitSuTratta(latlng, seg) {
        return hitSuPercorso(latlng, (seg.punti || []).map(m => m.pid), seg);
    }

    function iniziaDiramazioneDaLinea(e, seg, dir = null) {
        if (modo !== 'editor' || branchDrag || !seg) return;
        const ids = dir ? puntiDiramazione(dir) : (seg.punti || []).map(m => m.pid);
        if (ids.length < 2) return;
        const hit = hitSuPercorso(e.latlng, ids, seg, dir);
        if (!hit) return;
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
        branchDrag = {
            seg,
            dir,
            idx: hit.idx,
            lat: hit.lat,
            lng: hit.lng,
            inizioPx: map.latLngToContainerPoint(e.latlng),
            ultimo: e.latlng,
            mosso: false
        };
    }

    function mostraAnteprimaDiramazione(drag, latlng) {
        if (!layerBranchPreview) return;
        layerBranchPreview.clearLayers();
        const colore = coloreTratta(drag.seg, segmenti.indexOf(drag.seg));
        L.polyline([[drag.lat, drag.lng], [latlng.lat, latlng.lng]], {
            color: colore,
            weight: 2.5,
            opacity: 0.9,
            dashArray: '6 6',
            interactive: false
        }).addTo(layerBranchPreview);
        L.circleMarker([latlng.lat, latlng.lng], {
            radius: 5,
            color: '#ffffff',
            weight: 2,
            fillColor: colore,
            fillOpacity: 1,
            interactive: false
        }).addTo(layerBranchPreview);
    }

    function completaDiramazione() {
        if (!branchDrag) return;
        const drag = branchDrag;
        branchDrag = null;
        if (layerBranchPreview) layerBranchPreview.clearLayers();
        if (map.dragging && !map.dragging.enabled()) map.dragging.enable();
        if (!drag.mosso || !drag.ultimo) return;
        sopprimiClickFinoA = Date.now() + 400;
        const endpoint = creaPunto(drag.ultimo);
        if (!endpoint) return;
        creaDiramazione(drag.seg, drag.idx, { lat: drag.lat, lng: drag.lng }, endpoint, null, drag.dir);
    }

    function creaDiramazione(seg, idx, origine, endpoint, sorgente = null, padre = null) {
        const nuovo = prossimaDiramazione(seg, padre);
        if (!nuovo) {
            toast('Diramazioni esaurite per questa tratta.');
            return null;
        }
        const inter = creaPunto(origine);
        if (!inter) return null;
        inter.senzaNumero = true;
        const contenitore = padre
            ? (Array.isArray(padre.punti) ? padre.punti : (padre.punti = []))
            : (Array.isArray(seg.punti) ? seg.punti : (seg.punti = []));
        contenitore.splice(padre ? idx : idx + 1, 0, { pid: inter.id, numero: '' });
        endpoint.etichetta = nuovo.etichetta;
        endpoint.diramazione = true;
        endpoint.senzaNumero = false;
        const dir = {
            a: inter.id,
            b: endpoint.id,
            punti: [],
            suffisso: nuovo.suffisso,
            etichetta: nuovo.etichetta,
            stile: 'normale',
            notaNumero: null,
            diramazioni: []
        };
        const lista = padre
            ? (Array.isArray(padre.diramazioni) ? padre.diramazioni : (padre.diramazioni = []))
            : (Array.isArray(seg.diramazioni) ? seg.diramazioni : (seg.diramazioni = []));
        lista.push(dir);
        if (sorgente && sorgente.seg && sorgente.mem) {
            if (sorgente.dir) {
                sorgente.dir.punti = (sorgente.dir.punti || []).filter(m => m !== sorgente.mem);
            } else {
                sorgente.seg.punti = sorgente.seg.punti.filter(m => m !== sorgente.mem);
                if (!sorgente.seg.punti.length && !diramazioniRicorsive(sorgente.seg).length) {
                    eliminaTratta(sorgente.seg.id);
                }
            }
        }
        pulisciDiramazioni();
        rinumeriaTutti();
        disegnaEditor();
        renderTratte();
        toast(`Diramazione ${dir.etichetta} creata.`);
        return nuovo;
    }

    function opzioniLinea(seg, colore, opzioniComuni) {
        const stile = seg.stile || 'normale';
        const comuni = opzioniComuni || {};
        const inCorso = comuni.dashArray === '9 8';
        const classe = inCorso ? 'tratta-corrente' : null;
        const base = Object.assign({ color: colore, weight: 5, opacity: 0.95 }, comuni);
        if (stile === 'normale') {
            if (classe) base.className = classe;
            return [{ opzioni: base, offset: 0 }];
        }
        if (stile === 'piedi') {
            const piedi = Object.assign({}, base, {
                dashArray: '1 10',
                lineCap: 'round',
                lineJoin: 'round'
            });
            if (classe) piedi.className = classe;
            return [{ opzioni: piedi, offset: 0 }];
        }
        const dashLato = '14 10';
        const altoPieno = stile !== 'latoB';
        const bassoPieno = stile !== 'latoA';
        return [
            { opzioni: Object.assign({}, base, { color: colore, weight: 3, dashArray: altoPieno ? comuni.dashArray || null : dashLato, className: altoPieno ? classe : null }), offset: -3 },
            { opzioni: Object.assign({}, base, { color: colore, weight: 3, dashArray: bassoPieno ? comuni.dashArray || null : dashLato, className: bassoPieno ? classe : null }), offset: 3 }
        ];
    }

    function offsetPunti(pts, px, comeLatLng) {
        if (pts.length < 2 || !px) return pts;
        const normali = [];
        for (let i = 0; i < pts.length - 1; i++) {
            const dx = pts[i + 1].x - pts[i].x, dy = pts[i + 1].y - pts[i].y;
            const len = Math.hypot(dx, dy) || 1;
            normali.push({ x: -dy / len, y: dx / len });
        }
        return pts.map((pt, i) => {
            let nx, ny;
            if (i === 0) {
                nx = normali[0].x; ny = normali[0].y;
            } else if (i === pts.length - 1) {
                nx = normali[normali.length - 1].x; ny = normali[normali.length - 1].y;
            } else {
                const a = normali[i - 1], b = normali[i];
                const sx = a.x + b.x, sy = a.y + b.y;
                const sl = Math.hypot(sx, sy);
                if (sl < 1e-6) {
                    nx = a.x; ny = a.y;
                } else {
                    nx = sx / sl; ny = sy / sl;
                    const miter = Math.max(0.5, nx * a.x + ny * a.y);
                    nx /= miter; ny /= miter;
                }
            }
            const out = { x: pt.x + nx * px, y: pt.y + ny * px };
            return comeLatLng ? map.containerPointToLatLng([out.x, out.y]) : out;
        });
    }

    function offsetLatLngs(latlngs, px) {
        if (!px || latlngs.length < 2) return latlngs;
        return offsetPunti(latlngs.map(ll => map.latLngToContainerPoint(ll)), px, true);
    }

    function offsetCanvas(pts, px) {
        return offsetPunti(pts, px, false);
    }

    function tracciaLineaCanvas(ctx, pts, colore, larghezza, tratteggiata) {
        if (pts.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(255,255,255,0.94)';
        ctx.lineWidth = larghezza + 10;
        ctx.stroke();
        ctx.strokeStyle = colore;
        ctx.lineWidth = larghezza;
        ctx.setLineDash(tratteggiata ? [28, 20] : []);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function apriStileTratta(seg, dir = null) {
        if (!seg) return;
        segStile = { seg, dir };
        const target = dir || seg;
        const overlay = document.getElementById('overlayStile');
        overlay.style.setProperty('--anteprima-colore', coloreTratta(seg, segmenti.indexOf(seg)));
        document.getElementById('stileNome').textContent = dir
            ? `DIRAMAZIONE ${dir.etichetta || ''}`.trim()
            : etichettaTratta(seg);
        overlay.querySelectorAll('.stile-opzione').forEach(b => {
            b.classList.toggle('selezionato', b.dataset.stile === (target.stile || 'normale'));
        });
        overlay.hidden = false;
    }

    function chiudiStile() {
        document.getElementById('overlayStile').hidden = true;
        segStile = null;
    }

    function distanzaM(a, b) {
        const R = 6371000;
        const dLat = (b.lat - a.lat) * Math.PI / 180;
        const dLng = (b.lng - a.lng) * Math.PI / 180;
        const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
    }

    function lunghezzaSegmento(seg) {
        let metri = 0;
        for (let i = 1; i < seg.punti.length; i++) {
            const a = getPunto(seg.punti[i - 1].pid);
            const b = getPunto(seg.punti[i].pid);
            if (a && b) metri += distanzaM(a, b);
        }
        return metri / 1000;
    }

    function lunghezzaKm(route) {
        let metri = 0;
        route.tratte.forEach(seg => {
            const lista = seg.punti.map(m => puntoDiRoute(route, m.pid)).filter(Boolean);
            for (let i = 1; i < lista.length; i++) metri += distanzaM(lista[i - 1], lista[i]);
        });
        return metri / 1000;
    }

    function formatKm(km) {
        return km.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' km';
    }

    function dataRotta(iso) {
        const d = new Date(iso);
        return isNaN(d.getTime()) ? '' : d.toLocaleDateString('it-IT');
    }

    function iniziaMappa() {
        map = L.map('mappa', {
            center: [43.9362316, 10.2336469],
            zoom: 17,
            zoomControl: true,
            attributionControl: true,
            doubleClickZoom: false,
            tap: true,
            tapTolerance: 12
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            opacity: 0,
            attribution: 'Imagery &copy; Esri'
        }).addTo(map);

        layerEditor = L.layerGroup().addTo(map);
        layerViewer = L.layerGroup();
        layerSearch = L.layerGroup().addTo(map);
        layerBranchPreview = L.layerGroup().addTo(map);

        map.on('click', e => {
            if (modo === 'viewer' || Date.now() < sopprimiClickFinoA) return;
            if (clickTimer) clearTimeout(clickTimer);
            const ll = e.latlng;
            clickTimer = setTimeout(() => {
                clickTimer = null;
                aggiungiPunto(ll);
            }, 280);
        });

        map.on('dblclick', e => {
            if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
            if (Date.now() < sopprimiClickFinoA) return;
            if (e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
            if (modo === 'viewer') return;
            const hit = hitTest(e.latlng);
            if (hit.tipo === 'punto') {
                let seg = null, notaRef = null;
                for (const s of segmenti) {
                    const rif = riferimentoNotaPerPunto(s, hit.punto.id);
                    if (rif) { seg = s; notaRef = rif; break; }
                }
                apriNota(seg, hit.punto, notaRef);
                return;
            }
            if (hit.tipo === 'linea') {
                apriStileTratta(hit.seg);
                return;
            }
            if (hit.tipo === 'diramazione') {
                apriStileTratta(hit.seg, hit.diramazione);
                return;
            }
            nuovaTratta(e.latlng);
        });

        map.on('mousemove', e => {
            if (!branchDrag) return;
            branchDrag.ultimo = e.latlng;
            const px = map.latLngToContainerPoint(e.latlng);
            if (!branchDrag.mosso && px.distanceTo(branchDrag.inizioPx) > 7) {
                branchDrag.mosso = true;
                map.dragging.disable();
            }
            if (branchDrag.mosso) mostraAnteprimaDiramazione(branchDrag, e.latlng);
        });
        map.on('mouseup', () => completaDiramazione());
        map.on('touchend', () => completaDiramazione());
        document.addEventListener('mouseup', () => completaDiramazione());

        document.getElementById('satelliteToggle').addEventListener('click', () => {
            satelliteAttivo = !satelliteAttivo;
            applicaSatellite();
        });
        document.getElementById('satelliteOpacity').addEventListener('input', e => {
            if (!satelliteAttivo) {
                satelliteAttivo = true;
                applicaSatellite();
            } else {
                applicaSatellite();
            }
        });

        map.on('zoomend', () => { aggiornaLinee(); aggiornaLineeViewer(); });
        resetEditor(false);
        applicaSatellite();
        setTimeout(() => map.invalidateSize(), 0);
    }

    function mostraLoupe(punto, containerPt, colore) {
        const el = document.getElementById('loupe');
        el.style.setProperty('--loupe-color', colore || '#2c603d');
        el.hidden = false;
        const zoom = Math.min(19, map.getZoom() + 3);
        if (!loupeMap) {
            loupeMap = L.map('loupeMappa', {
                zoomControl: false,
                attributionControl: false,
                dragging: false,
                scrollWheelZoom: false,
                doubleClickZoom: false,
                tap: false
            }).setView([punto.lat, punto.lng], zoom);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(loupeMap);
        } else {
            loupeMap.setView([punto.lat, punto.lng], zoom, { animate: false });
        }
        el.style.left = Math.max(8, Math.min(window.innerWidth - 140, containerPt.x - 66)) + 'px';
        el.style.top = Math.max(8, Math.min(window.innerHeight - 140, containerPt.y - 168)) + 'px';
        setTimeout(() => loupeMap.invalidateSize(), 0);
    }

    function nascondiLoupe() {
        document.getElementById('loupe').hidden = true;
    }

    function separaSeCondiviso(seg, mem) {
        const occorrenze = segmenti.reduce((n, s) => n + s.punti.filter(m => m.pid === mem.pid).length, 0);
        if (occorrenze <= 1) return getPunto(mem.pid);
        const orig = getPunto(mem.pid);
        const copia = Object.assign({}, orig, { id: uid('p'), immagini: [...(orig.immagini || [])] });
        punti.push(copia);
        mem.pid = copia.id;
        return copia;
    }

    function unisciDopoTrascinamento(seg, mem, p, dir = null) {
        const vicino = puntoVicino({ lat: p.lat, lng: p.lng }, p.id);
        if (vicino) {
            p.lat = vicino.lat;
            p.lng = vicino.lng;
            disegnaEditor();
            renderTratte();
            return;
        }

        const hit = lineaVicino({ lat: p.lat, lng: p.lng }, seg.id, false, dir);
        if (hit) {
            creaDiramazione(hit.seg, hit.idx, { lat: hit.lat, lng: hit.lng }, p, { seg, mem, dir }, hit.diramazione);
            return;
        }

        disegnaEditor();
        renderTratte();
    }

    function creaMarker(seg, mem, punto, colore, offset, riferimentoNota = mem, dir = null) {
        let p = punto;
        const piccolo = !!p.senzaNumero && !p.etichetta;
        const classe = 'pin' + (piccolo ? ' senza-numero' : '') + (p.note ? ' con-nota' : '');
        const etichetta = p.etichetta || mem.numero || '00';
        const triangolo = p.note ? htmlTriangoloNota(riferimentoNota && riferimentoNota.notaNumero) : '';
        const icona = L.divIcon({
            className: 'pin-wrapper',
            html: `<div class="${classe}" style="background:${colore}">${piccolo ? '' : escapeHtml(etichetta)}${triangolo}</div>`,
            iconSize: piccolo ? [14, 14] : [34, 34],
            iconAnchor: piccolo ? [7, 7 + offset] : [17, 17 + offset]
        });
        const marker = L.marker([p.lat, p.lng], {
            icon: icona,
            draggable: true,
            riseOnHover: true
        }).addTo(layerEditor);

        marker.bindTooltip(coordsTesto(p), {
            direction: 'top',
            offset: [0, -12],
            opacity: 1,
            className: 'punto-tooltip'
        });

        marker.on('dragstart', () => {
            p = separaSeCondiviso(seg, mem);
            mostraLoupe(p, map.latLngToContainerPoint([p.lat, p.lng]), colore);
        });
        marker.on('drag', () => {
            const ll = marker.getLatLng();
            p.lat = ll.lat;
            p.lng = ll.lng;
            marker.setTooltipContent(coordsTesto(p));
            aggiornaLinee();
            renderTratte();
            mostraLoupe(p, map.latLngToContainerPoint(ll), colore);
        });
        marker.on('dragend', () => {
            nascondiLoupe();
            unisciDopoTrascinamento(seg, mem, p, dir);
        });
        marker.on('dblclick', e => {
            if (e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
            if (modo === 'editor') apriNota(seg, p, riferimentoNota);
        });
        marker.on('contextmenu', e => {
            if (e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
            eliminaAppartenenza(seg.id, mem.pid);
        });

        markerById.set(seg.id + '|' + mem.pid, marker);
        return marker;
    }

    function disegnaEditor() {
        if (!layerEditor) return;
        layerEditor.clearLayers();
        markerById.clear();
        lineeById.clear();
        lineeDiramazione = [];

        segmenti.forEach((seg, i) => {
            const colore = coloreTratta(seg, i);
            const lista = seg.punti.map(m => getPunto(m.pid)).filter(Boolean);
            if (lista.length >= 2) {
                const latlngs = lista.map(p => [p.lat, p.lng]);
                const linee = opzioniLinea(seg, colore, { dashArray: seg === corrente ? '9 8' : null }).map(({ opzioni, offset }) => {
                    const linea = L.polyline(offsetLatLngs(latlngs, offset), opzioni).addTo(layerEditor);
                    linea.on('mousedown touchstart', e => iniziaDiramazioneDaLinea(e, seg));
                    return { linea, offset };
                });
                lineeById.set(seg.id, { linee });
            }
            diramazioniRicorsive(seg).forEach(({ dir }) => {
                const latlngsDir = puntiDiramazione(dir).map(id => getPunto(id)).filter(Boolean).map(p => [p.lat, p.lng]);
                if (latlngsDir.length < 2) return;
                const correnteTratta = seg === corrente;
                const linee = opzioniLinea(dir, colore, {
                    weight: correnteTratta ? 4 : 3,
                    dashArray: correnteTratta ? '9 8' : null
                }).map(({ opzioni, offset }) => {
                    const linea = L.polyline(offsetLatLngs(latlngsDir, offset), opzioni).addTo(layerEditor);
                    linea.on('mousedown touchstart', e => iniziaDiramazioneDaLinea(e, seg, dir));
                    linea.on('dblclick', e => {
                        if (e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
                        apriStileTratta(seg, dir);
                    });
                    return { linea, offset };
                });
                lineeDiramazione.push({ linee, dir });
            });
        });

        const gruppi = new Map();
        const aggiungiAlGruppo = item => {
            const chiave = `${item.p.lat.toFixed(6)},${item.p.lng.toFixed(6)}`;
            if (!gruppi.has(chiave)) gruppi.set(chiave, []);
            gruppi.get(chiave).push(item);
        };
        segmenti.forEach((seg, i) => {
            const colore = coloreTratta(seg, i);
            seg.punti.forEach(m => {
                const p = getPunto(m.pid);
                if (p) aggiungiAlGruppo({ seg, mem: m, p, colore, notaRef: m, offset: 0 });
            });
            diramazioniRicorsive(seg).forEach(({ dir }) => {
                (dir.punti || []).forEach(m => {
                    const p = getPunto(m.pid);
                    if (p) aggiungiAlGruppo({ seg, dir, mem: m, p, colore, notaRef: m, offset: 0 });
                });
                const p = getPunto(dir.b);
                if (p) aggiungiAlGruppo({
                    seg,
                    dir,
                    mem: { pid: dir.b, numero: dir.etichetta || p.etichetta || '00' },
                    p,
                    colore,
                    notaRef: dir,
                    offset: 0
                });
            });
        });

        gruppi.forEach(arr => {
            if (arr.length === 1) {
                creaMarker(arr[0].seg, arr[0].mem, arr[0].p, arr[0].colore, arr[0].offset || 0, arr[0].notaRef, arr[0].dir || null);
                return;
            }
            const passo = arr.some(item => item.p.senzaNumero && !item.p.etichetta) ? 10 : 24;
            const base = -((arr.length - 1) * passo) / 2;
            arr.forEach((item, i) => creaMarker(
                item.seg, item.mem, item.p, item.colore,
                (item.offset || 0) + base + i * passo, item.notaRef, item.dir || null
            ));
        });
    }

    function aggiornaLinee() {
        lineeById.forEach((voci, id) => {
            const seg = segmenti.find(s => s.id === id);
            if (!seg) return;
            const latlngs = seg.punti.map(m => getPunto(m.pid)).filter(Boolean).map(p => [p.lat, p.lng]);
            voci.linee.forEach(({ linea, offset }) => linea.setLatLngs(offsetLatLngs(latlngs, offset)));
        });
        aggiornaLineeDiramazioni();
        segmenti.forEach(seg => rinumeriaNoteTratta(seg));
    }

    function aggiornaLineeDiramazioni() {
        lineeDiramazione.forEach(({ linee, dir }) => {
            const latlngs = puntiDiramazione(dir).map(id => getPunto(id)).filter(Boolean).map(p => [p.lat, p.lng]);
            if (latlngs.length < 2) return;
            linee.forEach(({ linea, offset }) => linea.setLatLngs(offsetLatLngs(latlngs, offset)));
        });
    }

    function aggiornaLineeViewer() {
        lineeViewer.forEach(({ linea, latlngs, offset }) => linea.setLatLngs(offsetLatLngs(latlngs, offset)));
    }

    function renderPannelloNote(route) {
        const box = document.getElementById('elencoNote');
        if (!box) return;
        box.innerHTML = '';

                const immagini = Array.isArray(n.p.note && n.p.note.immagini) ? n.p.note.immagini : [];
                html += `<div class="nota-riga" data-pid="${escapeHtml(n.p.id)}" title="Vai al punto della nota">` +
