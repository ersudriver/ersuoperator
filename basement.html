<!DOCTYPE html>
<html>
<head>
    <title>La mia pagina con musica</title>
    <style>
        body {
            background-color: #a4bb5b;
            color: #2c603d;
            font-family: 'Josefin Sans', sans-serif;
            text-align: center;
        }

        #titolo {
            font-size: 24px;
            margin-top: 50px;
        }

        #pulsante {
            display: inline-block;
            padding: 10px 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        #link {
            display: block;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <h1 id="titolo">QUI NON C'è NIENTE</h1>
    <button id="pulsante">Riproduci musica</button>
    <a id="link" href="/">Homepage</a>

    <audio id="musica" loop>
        <source src="tre_camionisti.mp3" type="audio/mpeg">
    </audio>

    <script>
        const pulsante = document.getElementById('pulsante');
        const musica = document.getElementById('musica');

        pulsante.addEventListener('click', function() {
            if (musica.paused) {
                musica.play();
                pulsante.textContent = 'Metti in pausa';
            } else {
                musica.pause();
                pulsante.textContent = 'Riproduci musica';
            }
        });
    </script>
</body>
</html>
