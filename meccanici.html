    <style>
        body {
            font-family: 'Josefin Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center; 
            padding: 20px;
            margin: 0;
            /* SFONDO RICHIESTO */
            background-color: #a4bb5b; 
            /* COLORE TESTO RICHIESTO */
            color: #2c603d; 
        }

        h1 {
            font-weight: 600;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            /* Sfondo tabella coordinato */
            background-color: #a4bb5b; 
            margin-bottom: 30px;
            margin-left: auto;
            margin-right: auto;
        }

        thead {
            /* Inversione colori per l'intestazione per leggibilità */
            background-color: #2c603d;
            color: #a4bb5b;
        }

        th {
            padding: 15px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            /* Bordi usando il colore del testo per coerenza */
            border-bottom: 1px solid #2c603d;
            color: #2c603d;
        }

        /* Effetto zebra opzionale usando variazioni dei due colori */
        tbody tr:nth-child(even) {
            background-color: rgba(44, 96, 61, 0.1); 
        }

        td a {
            color: #2c603d;
            text-decoration: underline;
            font-weight: 600;
        }

        /* Stile Link Homepage */
        .home-link {
            text-align: center;
            width: 100%;
            margin-top: 20px;
        }

        .link-home {
            color: #2c603d;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            border: 2px solid #2c603d;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .link-home:hover {
            background-color: #2c603d;
            color: #a4bb5b;
        }

        @media (max-width: 480px) {
            th, td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
