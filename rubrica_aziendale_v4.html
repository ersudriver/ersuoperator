<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca Contatti Real-time</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Josefin Sans', sans-serif; 
            background-color: #a4bb5b; 
            color: #2c603d; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
        }
        
        .container { 
            background: #a4bb5b; 
            padding: 2rem; 
            border-radius: 12px; 
            border: 2px solid #2c603d; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
        }

        h2 {
            color: #2c603d;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .btn-download {
            display: block; /* Cambiato in block per gestire meglio lo spazio */
            background-color: #2c603d; 
            color: #a4bb5b;           
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            margin: 0 auto 25px auto;
            max-width: 250px;
            border: none;
            cursor: pointer;
            font-family: 'Josefin Sans', sans-serif;
        }

        .btn-download:hover { opacity: 0.9; }

        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 20px; 
            border: 2px solid #2c603d; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            font-family: 'Josefin Sans', sans-serif;
            background-color: rgba(44, 96, 61, 0.05); /* Leggero stacco per l'input */
            color: #2c603d;
            outline: none;
        }

        input::placeholder { color: #2c603d; opacity: 0.6; }

        .result-item { 
            padding: 15px 10px; 
            border-bottom: 1px solid rgba(44, 96, 61, 0.3); 
            text-align: left; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .name { font-weight: 600; }

        .number-link { 
            color: #2c603d; 
            font-weight: 700; 
            text-decoration: none;
            border: 1px solid #2c603d;
            padding: 6px 12px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .no-results { color: #2c603d; margin-top: 20px; font-style: italic; }
        
        /* Indicatore di caricamento */
        #status { font-size: 0.8rem; margin-bottom: 10px; opacity: 0.7; }
    </style>
</head>
<body>

<div class="container">
    <h2>Rubrica Aziendale</h2>
    
    <a href="contatti.vcf" class="btn-download" download>SCARICA TUTTI I CONTATTI</a>

    <div id="status">Caricamento database...</div>
    
    <input type="text" id="searchInput" placeholder="Cerca un nome (min. 2 caratteri)..." oninput="searchData()">
    
    <div id="results"></div>
</div>

<script>
    let dataCache = [];
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS67eexfd9Plogb9viPBDF3GnSsaBAHn54ghW_qmWhlu3V5p5GsmYYG9f1lSFUldXxhM90AHhBZJGpB/pub?output=csv';

    async function loadData() {
        const statusDiv = document.getElementById('status');
        try {
            const response = await fetch(sheetUrl);
            const text = await response.text();
            // Split delle righe e pulizia
            const rows = text.split(/\r?\n/).slice(1); 
            
            dataCache = rows
                .map(row => {
                    const columns = row.split(',');
                    return { 
                        nome: columns[0]?.trim() || '', 
                        numero: columns[1]?.trim() || '' 
                    };
                })
                .filter(item => item.nome !== ''); // Rimuove righe vuote

            statusDiv.innerText = "Database pronto (" + dataCache.length + " contatti)";
            setTimeout(() => statusDiv.style.display = 'none', 2000);
        } catch (error) {
            console.error("Errore:", error);
            statusDiv.innerText = "Errore nel caricamento. Controlla la connessione.";
        }
    }
