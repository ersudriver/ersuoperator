<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portale Operatori</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            touch-action: pan-y;
        }


        body {
            background-color: #a4bb5b;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(44,96,61,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(44,96,61,0.08) 0%, transparent 50%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(44,96,61,0.03) 40px, rgba(44,96,61,0.03) 41px);
            color: #2c603d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e4a2a 0%, #2c603d 40%, #3a7a4e 100%);
            color: #a4bb5b;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #a4bb5b, #d4e68a, #a4bb5b);
        }

        header h1 {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 4rem;
            animation: fadeSlide 1s ease-out;
            letter-spacing: 2px;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: nowrap;
            max-width: 720px;
            margin: 0 auto;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            background: rgba(164,187,91,0.1);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(164,187,91,0.4);
            border-radius: 1.5rem;
            padding: 2rem 2.5rem;
            color: #a4bb5b;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.3s, color 0.3s, border-color 0.3s, transform 0.3s;
            width: calc(50% - 1.25rem);
        }

        .btn:hover {
            background: #a4bb5b;
            color: #2c603d;
            border-color: #a4bb5b;
            transform: translateY(-6px);
        }

        .btn svg {
            width: 56px;
            height: 56px;
            transition: transform 0.3s;
        }

        .btn:hover svg {
            transform: scale(1.15);
        }

        .section-divider {
            text-align: center;
            padding: 3rem 2rem 1rem;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            color: #2c603d;
            opacity: 0.8;
        }

        .section-divider-small {
            padding: 1.5rem 2rem 0.8rem;
            font-size: 1.15rem;
            cursor: pointer;
            list-style: none;
            user-select: none;
        }

        .section-divider-small::-webkit-details-marker { display: none; }
        .section-divider-small::after { content: ' ▾'; font-size: 0.85em; }
        details[open] .section-divider-small::after { content: ' ▴'; }
        details:not([open]) > .stemmi-grid-small { display: none; }



        .stemmi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            max-width: 1100px;
            margin: 0 auto 3rem;
            padding: 0 2rem;
        }

        .stemma-btn {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(6px);
            border: none;
            border-radius: 1.5rem;
            padding: 1.5rem 1rem;
            cursor: pointer;
            text-align: center;
            color: #2c603d;
            text-decoration: none;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            box-shadow: 0 4px 15px rgba(44,96,61,0.1);
        }

        .stemma-btn:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 30px rgba(44,96,61,0.2);
            background: rgba(255,255,255,0.25);
        }

        .stemmi-grid.stemmi-grid-small {
            grid-template-columns: repeat(3, minmax(0, 140px));
            justify-content: center;
            gap: 0.8rem;
            margin: 0 auto 3rem;
            padding: 0 2rem;
        }

        .stemma-btn-small {
            max-width: 140px;
            padding: 0.9rem 0.6rem;
            font-size: 0.85rem;
        }

        .stemma-btn img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 0.8rem;
            transition: transform 0.3s;
        }

        .stemma-btn-small img {
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 0.5rem;
        }

        .stemma-btn:hover img {
            transform: scale(1.08);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #2c603d;
            font-size: 0.9rem;
            opacity: 0.6;
            border-top: 1px solid rgba(44,96,61,0.15);
            margin-top: 1rem;
        }

        @media (max-width: 900px) {
            .stemmi-grid { grid-template-columns: repeat(4, 1fr); }
            header h1 { font-size: 3.5rem; }
        }

        @media (max-width: 500px) {
            body { overflow-x: hidden; }
            .stemmi-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .stemmi-grid.stemmi-grid-small { padding: 0 1rem; }
            .section-divider-small { padding: 1.2rem 1rem 0.6rem; font-size: 1rem; }
            header { padding: 1.5rem 1rem; }
            header h1 { font-size: 2.8rem; margin-bottom: 2rem; }
            .stemmi-grid { padding: 0 1rem; }
            .btn {
                width: calc(50% - 0.4rem);
                padding: 0.9rem 0.4rem;
                font-size: 0.8rem;
                gap: 0.5rem;
            }
            .btn svg {
                width: 30px;
                height: 30px;
            }
            .buttons {
                gap: 0.8rem;
                flex-wrap: nowrap;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html" style="color:inherit; text-decoration:none;">Portale Operatori</a></h1>
        <div class="buttons">
            <a href="https://ersudriver.github.io/ersuoperator/NUM" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    <path d="M8 7h8M8 11h8M8 15h6"/>
                </svg>
                RUBRICA
            </a>
            <a href="https://ersudriver.github.io/ersuoperator/REPORT" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                SEGNALA
            </a>
        </div>
    </header>

    <div class="section-divider">CARTINE DEI COMUNI</div>

    <div class="stemmi-grid">
        <a href="https://drive.google.com/drive/folders/1r5QDvhz84Pn3EYgovvnQAvMo9kwJN0Z_" class="stemma-btn"><img src="stemmi/camaiore.png" alt="Camaiore">Camaiore</a>
        <a href="https://drive.google.com/drive/folders/1wpR4UX9MRdE1KE5xmvxzRI6-ZnjtYXbO" class="stemma-btn" target="_blank"><img src="stemmi/massarosa.png" alt="Massarosa">Massarosa</a>
        <a href="https://drive.google.com/drive/u/0/folders/17ZPAcVHmZygO3AwKNfkPIEgZfSrXhiv1" class="stemma-btn" target="_blank"><img src="stemmi/montignoso.png" alt="Montignoso">Montignoso</a>
        <a href="https://drive.google.com/drive/folders/1PMXmsSXfSTzlY-qTlGKgC5AEAp4cE6DM" class="stemma-btn" target="_blank"><img src="stemmi/pietrasanta.png" alt="Pietrasanta">Pietrasanta</a>
    </div>

    <details>
        <summary class="section-divider section-divider-small">NON DISPONIBILI</summary>
        <div class="stemmi-grid stemmi-grid-small">
            <a href="https://drive.google.com/drive/folders/1NoLYJqEYqdIuVMeVHjzRdjOwI9Md5YsF?usp=drive_link" class="stemma-btn stemma-btn-small" target="_blank"><img src="stemmi/forte dei marmi.png" alt="Forte dei Marmi">Forte dei Marmi</a>
            <button type="button" class="stemma-btn stemma-btn-small"><img src="stemmi/seravezza.png" alt="Seravezza">Seravezza</button>
            <button type="button" class="stemma-btn stemma-btn-small"><img src="stemmi/stazzema.png" alt="Stazzema">Stazzema</button>
        </div>
    </details>

    <footer>&copy; 2026 Portale Operatori</footer>
</body>
</html>
