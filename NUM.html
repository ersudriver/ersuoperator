<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca Contatti</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Josefin Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #a4bb5b;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(44,96,61,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(44,96,61,0.08) 0%, transparent 50%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(44,96,61,0.03) 40px, rgba(44,96,61,0.03) 41px);
            color: #2c603d;
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, #1e4a2a 0%, #2c603d 40%, #3a7a4e 100%);
            color: #a4bb5b;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #a4bb5b, #d4e68a, #a4bb5b);
        }

        header h1 {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            animation: fadeSlide 1s ease-out;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .section-divider {
            text-align: center;
            padding: 3rem 2rem 1.5rem;
            font-size: 2rem;
            font-weight: 600;
            color: #2c603d;
            opacity: 0.8;
        }

        .container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(6px);
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 550px;
            margin: 2rem auto 2rem;
            box-shadow: 0 4px 15px rgba(44,96,61,0.1);
            text-align: center;
        }

        h2 {
            color: #2c603d;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .role-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
        }

        .btn-ruolo {
            display: flex;
            flex: 0 0 116px;
            width: 116px;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            gap: 0.4rem;
            background: rgba(44,96,61,0.08);
            border: 2px solid #2c603d;
            border-radius: 1rem;
            padding: 0.7rem 0.3rem;
            color: #2c603d;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, color 0.3s, transform 0.3s;
        }

        .btn-ruolo:hover {
            background: #2c603d;
            color: #a4bb5b;
            transform: translateY(-4px);
        }

        .btn-ruolo-malattie {
            background: #a94c42;
            border-color: #c0392b;
            color: #fff;
        }

        .btn-ruolo-malattie:hover {
            background: #8b0000;
            border-color: #8b0000;
            color: #fff;
        }

        .btn-ruolo svg {
            width: 26px;
            height: 26px;
            transition: transform 0.3s;
        }

        .btn-ruolo:hover svg {
            transform: scale(1.15);
        }

        .search-instruction {
            font-size: 12px;
            font-style: italic;
            line-height: 1.4;
            margin-bottom: 1rem;
            color: #2c603d;
            text-align: center;
        }

        .home-link {
            text-align: center;
            width: 100%;
            margin: 1rem 0 3rem;
        }

        .link-home {
            display: inline-block;
            color: #2c603d;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border: 2px solid #2c603d;
            padding: 12px 30px;
            border-radius: 1rem;
            transition: background 0.3s, color 0.3s, transform 0.3s;
        }

        .link-home:hover {
            background-color: #2c603d;
            color: #a4bb5b;
            transform: translateY(-3px);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            border: 2px solid #2c603d;
            border-radius: 0.8rem;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Josefin Sans', sans-serif;
            background: rgba(255,255,255,0.2);
            color: #2c603d;
            outline: none;
            transition: box-shadow 0.3s;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(44,96,61,0.2);
        }

        input::placeholder {
            color: #2c603d;
            opacity: 0.6;
        }

        .result-item {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(44,96,61,0.15);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .name {
            font-weight: 600;
            color: #2c603d;
        }

        .ruolo {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 0.5rem;
            background: rgba(44,96,61,0.12);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .number-link {
            color: #2c603d;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid #2c603d;
            padding: 6px 12px;
            border-radius: 0.6rem;
            transition: background 0.3s, color 0.3s;
        }

        .number-link:hover {
            background-color: #2c603d;
            color: #a4bb5b;
        }

        .no-results {
            color: #2c603d;
            margin-top: 1rem;
            font-style: italic;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 2rem;
            color: #2c603d;
            font-size: 0.9rem;
            opacity: 0.6;
            border-top: 1px solid rgba(44,96,61,0.15);
        }

        @media (max-width: 600px) {
            html, body { overflow-x: hidden; width: 100%; }
            header h1 { font-size: 2.5rem; }
            .section-divider { font-size: 1.5rem; }
            .container { margin: 2rem 1rem 2rem; }
            .btn-ruolo { flex-basis: 100px; width: 100px; font-size: 0.66rem; padding: 0.6rem 0.2rem; }
            .btn-ruolo svg { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html" style="color:inherit; text-decoration:none;">Portale Operatori</a></h1>
    </header>

    <div class="container">
        <h2>Rubrica Aziendale</h2>

        <div class="role-buttons">
            <button type="button" class="btn-ruolo" onclick="mostraRuolo('coordinatore')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                COORDINATORI
            </button>
            <button type="button" class="btn-ruolo" onclick="mostraRuolo('meccanico')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                MECCANICI
            </button>
            <button type="button" class="btn-ruolo" onclick="mostraRuolo('uff.personale')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2"/>
                    <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                UFF.PERSONALE
            </button>
            <button type="button" class="btn-ruolo" onclick="mostraRuolo('magazzino')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21V9l9-6 9 6v12"/>
                    <path d="M3 21h18"/>
                    <rect x="9" y="13" width="6" height="8"/>
                </svg>
                MAGAZZINO
            </button>
            <button type="button" class="btn-ruolo" onclick="mostraRuolo('risorse umane')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                RISORSE UMANE
            </button>
            <a href="tel:+390584282223" class="btn-ruolo btn-ruolo-malattie">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                MALATTIE
            </a>
        </div>

        <input type="text" id="searchInput" placeholder="prova a scrivere un nome, un cognome, o un comune..." onkeyup="searchData()">
        <div id="results"></div>

        <p class="search-instruction" style="margin-top:1rem;">
            Tocca sul numero per comporlo.
        </p>
    </div>

    <div class="home-link">
        <a href="index.html" class="link-home">torna alla homepage</a>
    </div>

    <footer>&copy; 2026 Portale Operatori</footer>

    <script>
        let dataCache = [];
        const ruoli = ['coordinatore', 'meccanico', 'uff.personale', 'magazzino', 'risorse umane'];
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS67eexfd9Plogb9viPBDF3GnSsaBAHn54ghW_qmWhlu3V5p5GsmYYG9f1lSFUldXxhM90AHhBZJGpB/pub?output=csv';

        function parseCsvRow(row) {
            const columns = [];
            let value = '';
            let inQuotes = false;

            for (let i = 0; i < row.length; i++) {
                const char = row[i];
                if (char === '"') {
                    if (inQuotes && row[i + 1] === '"') {
                        value += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    columns.push(value);
                    value = '';
                } else {
                    value += char;
                }
            }
            columns.push(value);
            return columns;
        }

        function normalizzaRuolo(valore) {
            return valore.toLowerCase().replace(/[\s.]/g, '');
        }

        async function loadData() {
            try {
                const response = await fetch(sheetUrl);
                const text = await response.text();
                const rows = text.split('\n').slice(1);
                dataCache = rows
                    .filter(row => row.trim() !== '')
                    .map(row => {
                        const columns = parseCsvRow(row.replace(/\r$/, ''));
                        return {
                            nome: columns[0]?.trim() || '',
                            numero: columns[1]?.trim() || '',
                            ruolo: columns[2]?.trim() || ''
                        };
                    });
            } catch (error) {
                console.error("Errore nel caricamento dati:", error);
            }
        }

        function searchData() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (query.length < 2) return;

            // Se la ricerca assomiglia a un ruolo, filtra sulla colonna C del foglio
            const queryRuolo = normalizzaRuolo(query);
            const ruoloCercato = query.length >= 3
                ? ruoli.find(r => normalizzaRuolo(r).startsWith(queryRuolo))
                : null;

            const filtered = ruoloCercato
                ? dataCache.filter(item => normalizzaRuolo(item.ruolo).includes(queryRuolo))
                : dataCache.filter(item => item.nome.toLowerCase().includes(query));

            if (filtered.length > 0) {
                filtered.forEach(item => {
                    const cleanNumber = item.numero ? item.numero.replace(/\s+/g, '') : '';
                    const badge = item.ruolo ? `<span class="ruolo">${item.ruolo}</span>` : '';
                    resultsDiv.innerHTML += `
                        <div class="result-item">
                            <span class="name">${item.nome}${badge}</span>
                            <a href="tel:${cleanNumber}" class="number-link">${item.numero}</a>
                        </div>`;
                });
            } else {
                resultsDiv.innerHTML = '<p class="no-results">Nessun contatto trovato</p>';
            }
        }

        function mostraRuolo(ruolo) {
            document.getElementById('searchInput').value = ruolo;
            searchData();
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        loadData();
    </script>
</body>
</html>
