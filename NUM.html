<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca Contatti</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Josefin Sans', sans-serif;
            min-height: 100vh;
            background-color: #a4bb5b;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(44,96,61,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(44,96,61,0.08) 0%, transparent 50%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(44,96,61,0.03) 40px, rgba(44,96,61,0.03) 41px);
            color: #2c603d;
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, #1e4a2a 0%, #2c603d 40%, #3a7a4e 100%);
            color: #a4bb5b;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #a4bb5b, #d4e68a, #a4bb5b);
        }

        header h1 {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            animation: fadeSlide 1s ease-out;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .section-divider {
            text-align: center;
            padding: 3rem 2rem 1.5rem;
            font-size: 2rem;
            font-weight: 600;
            color: #2c603d;
            opacity: 0.8;
        }

        .container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(6px);
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 550px;
            margin: 0 auto 2rem;
            box-shadow: 0 4px 15px rgba(44,96,61,0.1);
            text-align: center;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .back-link, .list-link {
            text-decoration: none;
            color: #2c603d;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .back-link:hover, .list-link:hover {
            opacity: 0.7;
        }

        h2 {
            color: #2c603d;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .btn-vcf {
            display: inline-block;
            background-color: #2c603d;
            color: #a4bb5b;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 0.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            transition: transform 0.3s, opacity 0.3s;
        }

        .btn-vcf:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .search-instruction {
            font-size: 14px;
            font-style: italic;
            line-height: 1.4;
            margin-bottom: 1rem;
            color: #2c603d;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            border: 2px solid #2c603d;
            border-radius: 0.8rem;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Josefin Sans', sans-serif;
            background: rgba(255,255,255,0.2);
            color: #2c603d;
            outline: none;
            transition: box-shadow 0.3s;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(44,96,61,0.2);
        }

        input::placeholder {
            color: #2c603d;
            opacity: 0.6;
        }

        .result-item {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(44,96,61,0.15);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .name {
            font-weight: 600;
            color: #2c603d;
        }

        .number-link {
            color: #2c603d;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid #2c603d;
            padding: 6px 12px;
            border-radius: 0.6rem;
            transition: background 0.3s, color 0.3s;
        }

        .number-link:hover {
            background-color: #2c603d;
            color: #a4bb5b;
        }

        .no-results {
            color: #2c603d;
            margin-top: 1rem;
            font-style: italic;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 2rem;
            color: #2c603d;
            font-size: 0.9rem;
            opacity: 0.6;
            border-top: 1px solid rgba(44,96,61,0.15);
        }

        @media (max-width: 600px) {
            html, body { overflow-x: hidden; width: 100%; }
            header h1 { font-size: 2.5rem; }
            .section-divider { font-size: 1.5rem; }
            .container { margin: 0 1rem 2rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Portale Operatori</h1>
    </header>

    <div class="section-divider">Ricerca Numeri</div>

    <div class="container">
        <div class="top-nav">
            <a href="index.html" class="back-link">&lt; torna alla homepage</a>
            <a href="lista_contatti" class="list-link">vedi la lista &gt;</a>
        </div>

        <h2>Rubrica Aziendale</h2>

        <a href="rubrica_aziendale.vcf" class="btn-vcf">scarica tutti i contatti</a>

        <p class="search-instruction">
            oppure scrivi un nome/cognome per vedere un numero di telefono <br>
            o un nome di un comune per i codici di cancelli e serrature
        </p>

        <input type="text" id="searchInput" placeholder="prova a digitare qualcosa..." onkeyup="searchData()">
        <div id="results"></div>
    </div>

    <footer>&copy; 2026 Portale Operatori</footer>

    <script>
        let dataCache = [];
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS67eexfd9Plogb9viPBDF3GnSsaBAHn54ghW_qmWhlu3V5p5GsmYYG9f1lSFUldXxhM90AHhBZJGpB/pub?output=csv';

        async function loadData() {
            try {
                const response = await fetch(sheetUrl);
                const text = await response.text();
                const rows = text.split('\n').slice(1);
                dataCache = rows.map(row => {
                    const columns = row.split(',');
                    return { nome: columns[0]?.trim(), numero: columns[1]?.trim() };
                });
            } catch (error) {
                console.error("Errore nel caricamento dati:", error);
            }
        }

        function searchData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (query.length < 2) return;

            const filtered = dataCache.filter(item =>
                item.nome && item.nome.toLowerCase().includes(query)
            );

            if (filtered.length > 0) {
                filtered.forEach(item => {
                    const cleanNumber = item.numero ? item.numero.replace(/\s+/g, '') : '';
                    resultsDiv.innerHTML += `
                        <div class="result-item">
                            <span class="name">${item.nome}</span>
                            <a href="tel:${cleanNumber}" class="number-link">${item.numero}</a>
                        </div>`;
                });
            } else {
                resultsDiv.innerHTML = '<p class="no-results">Nessun contatto trovato</p>';
            }
        }

        loadData();
    </script>
</body>
</html>
